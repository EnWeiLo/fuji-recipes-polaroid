<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161311" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>拍立得 · 富士食譜工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+JP:wght@600&family=Noto+Serif+TC:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sumi:#161311; --char:#2b2622; --paper:#f4eee4; --ink:#2a2218;
      --cream:#f6efe4; --muted:#9b8f82; --fuji:#e60012; --line:rgba(255,255,255,.08);
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:#161311; color:var(--cream); font-family:"Noto Sans TC",sans-serif; }
    button,input,select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .top {
      position:sticky; top:0; z-index:10;
      padding:calc(12px + var(--safe-t)) 16px 12px;
      display:flex; align-items:center; gap:10px;
      background:color-mix(in srgb, var(--sumi) 82%, transparent);
      backdrop-filter:blur(16px); border-bottom:1px solid var(--line);
    }
    .brand { flex:1; }
    .brand h1 { margin:0; font-family:"Noto Serif JP",serif; font-size:18px; letter-spacing:.16em; }
    .pbtn {
      border:0; min-height:40px; padding:0 14px; border-radius:999px;
      background:var(--paper); color:var(--ink); font-weight:700; text-decoration:none;
      display:inline-grid; place-items:center;
    }
    .pbtn.red { background:var(--fuji); color:#fff; }
    .pbtn.ghost { background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1px var(--line); }
    .pbtn.full { width:100%; }
    .wrap { padding:16px; max-width:760px; margin:0 auto; padding-bottom:calc(32px + var(--safe-b)); }
    .pick {
      position:relative; display:grid; place-items:center;
      width:100%; min-height:48px; margin-bottom:14px;
      border:0; border-radius:999px; background:var(--paper); color:var(--ink);
      font-weight:700;
    }
    .pick input {
      position:absolute; inset:0; width:100%; height:100%;
      opacity:0; margin:0; cursor:pointer; font-size:16px;
    }
    .stage { display:grid; place-items:center; margin:8px 0 16px; }
    .polaroid {
      width:min(90vw, 440px); position:relative;
      box-shadow:0 18px 40px rgba(0,0,0,.45);
      animation:drop .55s cubic-bezier(.2,1.1,.3,1);
      overflow:hidden;
    }
    .polaroid.white { background:#f7f3ec; }
    .polaroid.black { background:#111; }
    .polaroid.tint { background:rgba(80,70,60,.55); }
    .pad { padding:4.6% 4.6% 0; }
    #photo { width:100%; display:block; background:#222; }
    .caption { position:relative; height:92px; user-select:none; touch-action:none; }
    .txt { position:absolute; top:14px; max-width:62%; line-height:1.25; cursor:grab; }
    .txt:active { cursor:grabbing; }
    .txt b { display:block; }
    .txt.left { left:6%; text-align:left; }
    .txt.right { right:6%; text-align:right; }
    .form { display:grid; gap:10px; }
    label.field { display:grid; gap:6px; font-size:12px; color:var(--muted); }
    .field input,.field select {
      width:100%; border:0; background:var(--char); border-radius:12px; padding:11px 12px;
      box-shadow:inset 0 0 0 1px var(--line); outline:none;
    }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; }
    .ratios { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0; }
    .ratios button, .sides button {
      border:0; min-height:42px; border-radius:12px; font-weight:700; font-size:13px;
      background:var(--char); color:var(--cream); box-shadow:inset 0 0 0 1px var(--line);
    }
    .ratios button.on, .sides button.on { outline:2px solid #e60012; }
    .sides { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stamp {
      position:absolute; top:18%; writing-mode:vertical-rl; letter-spacing:.18em;
      font-size:11px; font-weight:700; cursor:grab; touch-action:none; user-select:none;
    }
    .stamp.left { left:1.6%; }
    .stamp.right { right:1.6%; }
    .stamp.off { display:none; }
    #photo { cursor:grab; touch-action:none; }
    .frames { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .frames button { border:0; min-height:42px; border-radius:12px; font-weight:700; font-size:13px; }
    .frames .w { background:#f7f3ec; color:#2a2218; }
    .frames .k { background:#111; color:#f6efe4; box-shadow:inset 0 0 0 1px #444; }
    .frames .t { background:linear-gradient(90deg,#8a6a4a,#5a4032); color:#fff; }
    .frames button.on { outline:2px solid #e60012; }
    .shutter { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40; }
    .shutter.go { animation:flash .42s ease; }
    .hidden { display:none; }
    @keyframes drop { from { opacity:0; transform:translateY(-22px) rotate(-6deg);} to { opacity:1; transform:none;} }
    @keyframes flash { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
  <div class="shutter" id="shutter"></div>
  <header class="top">
    <a class="pbtn ghost" href="./">返回</a>
    <div class="brand"><h1>拍立得</h1></div>
  </header>
  <div class="wrap">
    <label class="pick">選擇照片
      <input id="file" type="file" accept="image/jpeg,image/png,image/heic,image/heif,image/*" />
    </label>
    <p class="hint">iPhone 選圖後若有「加入／完成」請按下去。建議相機 JPEG。</p>
    <div class="frames">
      <button class="w on" data-frame="white">白框</button>
      <button class="k" data-frame="black">黑框</button>
      <button class="t" data-frame="tint">取色半透明</button>
    </div>
    <div class="ratios" id="ratios">
      <button class="on" data-aspect="orig">原圖</button>
      <button data-aspect="mini">Mini</button>
      <button data-aspect="square">方框</button>
      <button data-aspect="wide">Wide</button>
    </div>
    <div class="stage">
      <div class="polaroid white" id="frame">
        <div class="stamp off" id="stamp"></div>
        <div class="pad"><canvas id="photo" width="1200" height="900"></canvas></div>
        <div class="caption" id="caption">
          <div class="txt left" id="boxL" data-side="left"><b id="t-cam">相機</b><span id="t-lens">鏡頭</span></div>
          <div class="txt right" id="boxR" data-side="right"><b id="t-exp">ISO · f/ · 快門</b></div>
        </div>
      </div>
    </div>
    <div class="form">
      <div class="row2">
        <label class="field">相機<input id="cam" placeholder="X-T50"></label>
        <label class="field">鏡頭<input id="lens" placeholder="XF35mmF1.4 R"></label>
      </div>
      <div class="row2">
        <label class="field">ISO<input id="iso" placeholder="400"></label>
        <label class="field">光圈<input id="fnum" placeholder="f/1.4"></label>
      </div>
      <label class="field">快門<input id="shut" placeholder="1/250"></label>
      <div class="row3">
        <label class="field">字型
          <select id="font">
            <option value="sans">無襯線</option>
            <option value="serif">襯線</option>
            <option value="mono">等寬</option>
          </select>
        </label>
        <label class="field">大小
          <select id="size">
            <option value="12">小</option>
            <option value="14" selected>中</option>
            <option value="18">大</option>
            <option value="22">特大</option>
          </select>
        </label>
        <label class="field">顏色<input id="color" type="color" value="#2c261e"></label>
      </div>
      <label class="field">日期戳
        <select id="date-on">
          <option value="off">關</option>
          <option value="on">開</option>
        </select>
      </label>
      <label class="field">日期<input id="date-text" placeholder="2026.09.07"></label>
      <div class="sides" id="date-sides">
        <button class="on" data-side="left">左側</button>
        <button data-side="right">右側</button>
      </div>
      <label class="field">日期顏色<input id="date-color" type="color" value="#2c261e"></label>
      <button class="pbtn ghost full" id="reset">重設文字位置</button>
      <button class="pbtn ghost full" id="reset-crop">重設裁切</button>
      <button class="pbtn red full" id="save">下載拍立得</button>
    </div>
    <p class="hint">拖動照片調整裁切，電腦可用滾輪縮放。日期為直書，可關、可改色與上下位置。</p>
  </div>
<script>
const $ = s => document.querySelector(s);
const flash = () => { const s=$("#shutter"); s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); };
const FONTS = {
  sans: '"Noto Sans TC", sans-serif',
  serif: '"Noto Serif TC","Noto Serif JP", serif',
  mono: '"Share Tech Mono", ui-monospace, monospace'
};
let source = null;
let frameStyle = "white";
let tint = "rgba(120,90,70,.55)";
let pos = { left: 6, right: 6 };
let aspect = "orig";
let crop = { z:1, x:0, y:0 };
let dateSide = "left";
let datePos = 18;

function applyType(){
  const font = FONTS[$("#font").value] || FONTS.sans;
  const size = Number($("#size").value)||14;
  const color = $("#color").value;
  ["boxL","boxR"].forEach(id=>{
    const el = $("#"+id);
    el.style.fontFamily = font;
    el.style.color = color;
  });
  $("#t-cam").style.fontSize = size+"px";
  $("#t-lens").style.fontSize = Math.max(11, size-2)+"px";
  $("#t-exp").style.fontSize = size+"px";
}
function applyPos(){
  $("#boxL").style.left = pos.left+"%";
  $("#boxL").style.right = "auto";
  $("#boxR").style.right = pos.right+"%";
  $("#boxR").style.left = "auto";
}
function fillText(){
  $("#t-cam").textContent = $("#cam").value.trim() || "相機";
  $("#t-lens").textContent = $("#lens").value.trim();
  const iso = $("#iso").value.trim();
  const fnum = $("#fnum").value.trim();
  const shut = $("#shut").value.trim();
  $("#t-exp").textContent = [iso && ("ISO "+iso.replace(/^ISO\s*/i,"")), fnum, shut].filter(Boolean).join("   ") || "ISO · f/ · 快門";
}
function setFrame(name){
  frameStyle = name;
  $("#frame").className = "polaroid " + name;
  document.querySelectorAll(".frames button").forEach(b=>b.classList.toggle("on", b.dataset.frame===name));
  if(name==="black"){
    if($("#color").value==="#2c261e" || $("#color").value==="#2C261E") $("#color").value = "#f6efe4";
  } else if(name==="white"){
    if($("#color").value==="#f6efe4" || $("#color").value==="#F6EFE4") $("#color").value = "#2c261e";
  }
  if(name==="tint") $("#frame").style.background = tint;
  else $("#frame").style.background = "";
  applyType();
}

function winSize(){
  if(!source) return {w:1200,h:900};
  let r = source.width/source.height;
  if(aspect==="mini") r=2/3;
  else if(aspect==="square") r=1;
  else if(aspect==="wide") r=3/2;
  const max=1600;
  if(r>=1) return {w:max, h:Math.max(1,Math.round(max/r))};
  return {w:Math.max(1,Math.round(max*r)), h:max};
}
function coverRect(w,h){
  const sw=source.width, sh=source.height;
  const base=Math.max(w/sw, h/sh);
  const s=base*Math.max(1, crop.z);
  const dw=sw*s, dh=sh*s;
  let x=(w-dw)/2+crop.x;
  let y=(h-dh)/2+crop.y;
  if(dw>=w) x=Math.min(0, Math.max(w-dw, x)); else x=(w-dw)/2;
  if(dh>=h) y=Math.min(0, Math.max(h-dh, y)); else y=(h-dh)/2;
  return {x,y,dw,dh};
}
function applyStamp(){
  const el=$("#stamp");
  const on=$("#date-on").value==="on";
  const text=($("#date-text").value||"").trim();
  el.textContent = text;
  el.className = "stamp " + (on && text ? dateSide : "off");
  el.style.color = $("#date-color").value;
  el.style.top = datePos + "%";
}
function drawPreview(){
  const c = $("#photo");
  const ctx = c.getContext("2d");
  if(!source){
    c.width = 1200; c.height = 900;
    ctx.fillStyle = "#cfc6b8"; ctx.fillRect(0,0,c.width,c.height);
    applyStamp();
    return;
  }
  const {w,h}=winSize();
  c.width=w; c.height=h;
  ctx.fillStyle="#222"; ctx.fillRect(0,0,w,h);
  const r=coverRect(w,h);
  ctx.drawImage(source, r.x, r.y, r.dw, r.dh);
  sampleTint(ctx, w, h);
  applyStamp();
}

function sampleTint(ctx, w, h){
  try{
    const step = Math.max(8, Math.floor(Math.min(w,h)/24));
    let r=0,g=0,b=0,n=0;
    const data = ctx.getImageData(0,0,w,h).data;
    for(let y=0;y<h;y+=step){
      for(let x=0;x<w;x+=step){
        const i = (y*w+x)*4;
        r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
      }
    }
    if(!n) return;
    r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
    tint = "rgba("+r+","+g+","+b+",0.58)";
    if(frameStyle==="tint") $("#frame").style.background = tint;
  }catch(e){}
}

function fmtShutter(v){
  if(!v || !isFinite(v) || v<=0) return "";
  if(v>=1) return Number(v.toFixed(1))+"s";
  return "1/"+Math.round(1/v);
}
function fmtF(v){
  if(!v || !isFinite(v)) return "";
  const n = v>=10 ? v.toFixed(0) : v.toFixed(1);
  return "f/"+n.replace(/\.0$/,"");
}
function cleanCam(make, model){
  model = (model||"").replace(/^FUJIFILM\s+/i,"").trim();
  make = (make||"").trim();
  if(!model && !make) return "";
  if(model && make && !/fuji/i.test(make) && !model.toUpperCase().includes(make.split(" ")[0].toUpperCase()))
    return (make+" "+model).trim();
  return model || make;
}

async function readExif(buf){
  const u8 = new Uint8Array(buf);
  if(u8[0]!==0xFF || u8[1]!==0xD8) return {};
  let off=2;
  while(off+4<u8.length){
    if(u8[off]!==0xFF) break;
    const marker=u8[off+1], size=(u8[off+2]<<8)|u8[off+3];
    if(marker===0xE1){
      const start=off+4;
      const head=String.fromCharCode.apply(null, Array.from(u8.slice(start,start+6)));
      if(head.startsWith("Exif")) return parseTiff(buf, start+6);
    }
    if(marker===0xDA) break;
    off += 2+size;
  }
  return {};
}
function parseTiff(buf, start){
  const v = new DataView(buf);
  const le = v.getUint8(start)===0x49;
  const u16 = o => v.getUint16(start+o, le);
  const u32 = o => v.getUint32(start+o, le);
  const decode = (type,count,valOff)=>{
    const unit = {1:1,2:1,3:2,4:4,5:8,7:1}[type]||1;
    const inline = unit*count<=4;
    const o = inline ? valOff : u32(valOff);
    try{
      if(type===2){
        let s=""; for(let i=0;i<count-1;i++){ const c=v.getUint8(start+o+i); if(!c) break; s+=String.fromCharCode(c);} return s;
      }
      if(type===3) return v.getUint16(start+o,le);
      if(type===4) return v.getUint32(start+o,le);
      if(type===5){
        const n=v.getUint32(start+o,le), d=v.getUint32(start+o+4,le); return d?n/d:0;
      }
    }catch(e){}
    return "";
  };
  const readIFD = rel => {
    const n=u16(rel), tags={};
    for(let i=0;i<n;i++){
      const e=rel+2+i*12;
      tags[u16(e)] = decode(u16(e+2), u32(e+4), e+8);
    }
    return tags;
  };
  const ifd0 = readIFD(u32(4));
  const exif = ifd0[0x8769] ? readIFD(ifd0[0x8769]) : {};
  return {
    make: ifd0[0x010F]||"",
    model: ifd0[0x0110]||"",
    lens: exif[0xA434]||"",
    iso: exif[0x8827]||exif[0x8833]||"",
    fnum: exif[0x829D]||"",
    shut: exif[0x829A]||"",
    date: exif[0x9003]||exif[0x9004]||ifd0[0x0132]||""
  };
}

async function loadFile(file){
  const buf = await file.arrayBuffer();
  let meta={};
  try{ meta = await readExif(buf); }catch(e){}
  $("#cam").value = cleanCam(meta.make, meta.model);
  $("#lens").value = (meta.lens||"").trim();
  $("#iso").value = meta.iso ? String(meta.iso) : "";
  $("#fnum").value = fmtF(Number(meta.fnum));
  $("#shut").value = typeof meta.shut==="number" ? fmtShutter(meta.shut) : "";
  if(meta.date){
    const m=String(meta.date).match(/(\d{4}).(\d{2}).(\d{2})/);
    if(m) $("#date-text").value=m[1]+"."+m[2]+"."+m[3];
  }
  crop={z:1,x:0,y:0};
  fillText();
  const blob = new Blob([buf], { type: file.type || "image/jpeg" });
  try{
    source = await createImageBitmap(blob, { imageOrientation: "from-image" });
  }catch(e){
    try{
      source = await createImageBitmap(blob);
    }catch(e2){
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
      source = await createImageBitmap(img);
      URL.revokeObjectURL(url);
    }
  }
  drawPreview();
}


function exportCard(){
  if(!source){ alert("先上傳照片"); return; }
  drawPreview();
  const photo = $("#photo");
  const dateOn = $("#date-on").value==="on" && ($("#date-text").value||"").trim();
  const side = Math.round(photo.width * (dateOn ? 0.09 : 0.046));
  const bottom = Math.round(photo.width * 0.22);
  const w = photo.width + side*2;
  const h = photo.height + side + bottom;
  const out = document.createElement("canvas");
  out.width=w; out.height=h;
  const ctx=out.getContext("2d");
  if(frameStyle==="black") ctx.fillStyle="#111";
  else if(frameStyle==="tint"){
    const m = tint.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    ctx.fillStyle = m ? "rgba("+m[1]+","+m[2]+","+m[3]+",0.92)" : "#6a5344";
  } else ctx.fillStyle="#f7f3ec";
  ctx.fillRect(0,0,w,h);
  if(frameStyle==="tint"){
    ctx.globalAlpha = 0.35;
    ctx.drawImage(photo, side-18, side-18, photo.width+36, photo.height+36);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(photo, side, side);
  const color = $("#color").value;
  const font = FONTS[$("#font").value]||FONTS.sans;
  const size = Math.round((Number($("#size").value)||14) * (photo.width/360));
  ctx.fillStyle = color;
  ctx.textBaseline = "top";
  const y = side + photo.height + Math.round(bottom*0.22);
  const cam = $("#cam").value.trim();
  const lens = $("#lens").value.trim();
  const iso = $("#iso").value.trim();
  const fnum = $("#fnum").value.trim();
  const shut = $("#shut").value.trim();
  const leftX = side + (pos.left/100)*photo.width;
  ctx.textAlign="left";
  ctx.font = "700 "+size+"px "+font;
  ctx.fillText(cam||"", leftX, y);
  ctx.font = "500 "+Math.round(size*0.82)+"px "+font;
  ctx.fillText(lens||"", leftX, y+size+6);
  const rightX = w - side - (pos.right/100)*photo.width;
  ctx.textAlign="right";
  ctx.font = "700 "+size+"px "+font;
  ctx.fillText([iso && ("ISO "+iso.replace(/^ISO\s*/i,"")), fnum, shut].filter(Boolean).join("   "), rightX, y+8);
  if(dateOn){
    const ds=($("#date-text").value||"").trim();
    const dsize=Math.round(photo.width*0.028);
    ctx.save();
    ctx.fillStyle=$("#date-color").value;
    ctx.font="700 "+dsize+"px "+font;
    ctx.textAlign="left";
    ctx.textBaseline="top";
    const along = datePos/100;
    const tx = dateSide==="left" ? Math.round(side*0.28) : w-Math.round(side*0.72);
    const ty = side + photo.height*along;
    ctx.translate(tx, ty);
    ctx.rotate(Math.PI/2);
    ctx.fillText(ds, 0, 0);
    ctx.restore();
  }
  flash();
  out.toBlob(function(b){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="polaroid.jpg";
    a.click();
  },"image/jpeg",0.92);
}

function bindDrag(el, side){
  const down = ev => {
    ev.preventDefault();
    const startX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const start = pos[side];
    const move = e => {
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cap = $("#caption").getBoundingClientRect();
      const dx = ((cx-startX)/cap.width)*100;
      let next = start + (side==="left"?dx:-dx);
      next = Math.max(2, Math.min(48, next));
      pos[side]=next; applyPos();
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    window.addEventListener("touchmove", move, {passive:false});
    window.addEventListener("touchend", up);
  };
  el.addEventListener("mousedown", down);
  el.addEventListener("touchstart", down, {passive:false});
}

$("#file").addEventListener("change", e=>{
  const f=e.target.files && e.target.files[0];
  if(f) loadFile(f).catch(err=>alert(err.message||"讀取照片失敗"));
});
["cam","lens","iso","fnum","shut"].forEach(id => $("#"+id).addEventListener("input", fillText));
["font","size","color"].forEach(id => $("#"+id).addEventListener("input", applyType));
document.querySelectorAll(".frames button").forEach(b=>b.onclick=()=>setFrame(b.dataset.frame));
document.querySelectorAll("#ratios button").forEach(b=>b.onclick=()=>{
  aspect=b.dataset.aspect;
  document.querySelectorAll("#ratios button").forEach(x=>x.classList.toggle("on", x===b));
  crop={z:1,x:0,y:0}; drawPreview();
});
document.querySelectorAll("#date-sides button").forEach(b=>b.onclick=()=>{
  dateSide=b.dataset.side;
  document.querySelectorAll("#date-sides button").forEach(x=>x.classList.toggle("on", x===b));
  applyStamp();
});
["date-on","date-text","date-color"].forEach(id=>$("#"+id).addEventListener("input", applyStamp));
$("#date-on").addEventListener("change", applyStamp);
$("#reset").onclick=()=>{ pos={left:6,right:6}; applyPos(); };
$("#reset-crop").onclick=()=>{ crop={z:1,x:0,y:0}; drawPreview(); };
$("#save").onclick=exportCard;
(function bindCrop(){
  const c=$("#photo");
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  const pt=e=> e.touches?e.touches[0]:e;
  const down=e=>{
    if(!source) return;
    e.preventDefault();
    dragging=true; c.style.cursor="grabbing";
    sx=pt(e).clientX; sy=pt(e).clientY; ox=crop.x; oy=crop.y;
  };
  const move=e=>{
    if(!dragging) return;
    const box=c.getBoundingClientRect();
    const k=c.width/box.width;
    crop.x=ox+(pt(e).clientX-sx)*k;
    crop.y=oy+(pt(e).clientY-sy)*k;
    drawPreview();
  };
  const up=()=>{ dragging=false; c.style.cursor="grab"; };
  c.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  c.addEventListener("touchstart", down, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
  c.addEventListener("wheel", e=>{
    if(!source) return;
    e.preventDefault();
    crop.z = Math.max(1, Math.min(4, crop.z + (e.deltaY<0?0.08:-0.08)));
    drawPreview();
  }, {passive:false});
})();

(function bindStamp(){
  const el=$("#stamp");
  let dragging=false, sy=0, start=18;
  const pt=e=>e.touches?e.touches[0]:e;
  const down=e=>{
    if(el.classList.contains("off")) return;
    e.preventDefault(); e.stopPropagation();
    dragging=true; el.style.cursor="grabbing";
    sy=pt(e).clientY; start=datePos;
  };
  const move=e=>{
    if(!dragging) return;
    const box=$("#frame").getBoundingClientRect();
    datePos = Math.max(6, Math.min(78, start + ((pt(e).clientY-sy)/box.height)*100));
    applyStamp();
  };
  const up=()=>{ dragging=false; el.style.cursor="grab"; };
  el.addEventListener("mousedown", down);
  el.addEventListener("touchstart", down, {passive:false});
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
})();
bindDrag($("#boxL"),"left");
bindDrag($("#boxR"),"right");
applyType(); applyPos(); drawPreview();
</script>
