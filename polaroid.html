<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161311" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>拍立得 · 富士食譜工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+JP:wght@600&family=Noto+Serif+TC:wght@600;700&family=Share+Tech+Mono&family=Zen+MaruGothic:wght@500;700&family=Kiwi+Maru:wght@500&family=Yuji+Syuku&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --sumi:#161311; --char:#2b2622; --paper:#f4eee4; --ink:#2a2218;
      --cream:#f6efe4; --muted:#9b8f82; --fuji:#e60012; --line:rgba(255,255,255,.08);
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:#161311; color:var(--cream); font-family:"Noto Sans TC",sans-serif; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .top {
      position:sticky; top:0; z-index:10;
      padding:calc(12px + var(--safe-t)) 16px 12px;
      display:flex; align-items:center; gap:10px;
      background:color-mix(in srgb, var(--sumi) 82%, transparent);
      backdrop-filter:blur(16px); border-bottom:1px solid var(--line);
    }
    .brand { flex:1; }
    .brand h1 { margin:0; font-family:"Noto Serif JP",serif; font-size:18px; letter-spacing:.16em; }
    .pbtn {
      border:0; min-height:40px; padding:0 14px; border-radius:999px;
      background:var(--paper); color:var(--ink); font-weight:700; text-decoration:none;
      display:inline-grid; place-items:center; text-align:center;
    }
    .pbtn.red { background:var(--fuji); color:#fff; }
    .pbtn.ghost { background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1px var(--line); }
    .pbtn.full { width:100%; margin-top:6px; }
    .wrap { padding:16px; max-width:760px; margin:0 auto; padding-bottom:calc(32px + var(--safe-b)); }
    .pick {
      position:relative; display:grid; place-items:center;
      width:100%; min-height:48px; margin-bottom:14px;
      border:0; border-radius:999px; background:var(--paper); color:var(--ink);
      font-weight:700;
    }
    .pick input {
      position:absolute; inset:0; width:100%; height:100%;
      opacity:0; margin:0; cursor:pointer; font-size:16px;
    }
    .thumb-list {
      display:flex; gap:10px; overflow-x:auto; padding:8px 0; margin-bottom:10px;
    }
    .thumb-item {
      width:64px; height:64px; border-radius:8px; border:2px solid transparent;
      overflow:hidden; cursor:pointer; flex-shrink:0; position:relative; background:#222;
    }
    .thumb-item img { width:100%; height:100%; object-fit:cover; }
    .thumb-item.active { border-color:var(--fuji); }
    .stage { display:grid; place-items:center; margin:8px 0 16px; }
    .polaroid-container {
      width:min(90vw, 440px);
      box-shadow:0 18px 40px rgba(0,0,0,.45);
      animation:drop .55s cubic-bezier(.2,1.1,.3,1);
      overflow:hidden;
      border-radius:4px;
      background-image: 
        linear-gradient(45deg, #222 25%, transparent 25%), 
        linear-gradient(-45deg, #222 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222 75%), 
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    #mainCanvas {
      width:100%;
      height:auto;
      display:block;
      cursor:grab;
      touch-action:none;
      user-select:none;
    }
    .form { display:grid; gap:10px; }
    label.field { display:grid; gap:6px; font-size:12px; color:var(--muted); }
    .field input,.field select,.field textarea {
      width:100%; border:0; background:var(--char); border-radius:12px; padding:11px 12px;
      box-shadow:inset 0 0 0 1px var(--line); outline:none;
    }
    .field input[type="color"] {
      height:52px; min-height:52px; padding:6px; border-radius:14px;
    }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; }
    .ratios { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0; }
    .ratios button, .sides button {
      border:0; min-height:42px; border-radius:12px; font-weight:700; font-size:13px;
      background:var(--char); color:var(--cream); box-shadow:inset 0 0 0 1px var(--line);
    }
    .ratios button.on, .sides button.on { outline:2px solid #e60012; }
    .sides { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .frames { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .frames button { border:0; min-height:42px; border-radius:10px; font-weight:700; font-size:12px; padding:2px; }
    .frames .w { background:#f7f3ec; color:#2a2218; }
    .frames .k { background:#111; color:#f6efe4; box-shadow:inset 0 0 0 1px #444; }
    .frames .t { background:linear-gradient(90deg,#8a6a4a,#5a4032); color:#fff; }
    .frames .v { background:#e8dfcb; color:#4a3b2c; border:1px dashed #a89f8b; }
    .frames .f { background:#0d0d0d; color:#e09f3e; border:1px solid #e09f3e; }
    .frames button.on { outline:2px solid #e60012; }
    .shutter { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40; }
    .shutter.go { animation:flash .42s ease; }
    @keyframes drop { from { opacity:0; transform:translateY(-22px) rotate(-6deg);} to { opacity:1; transform:none;} }
    @keyframes flash { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
  <div class="shutter" id="shutter"></div>
  <header class="top">
    <a class="pbtn ghost" href="./">返回</a>
    <div class="brand"><h1>拍立得</h1></div>
  </header>
  <div class="wrap">
    <label class="pick">選擇照片 (最多 5 張)
      <input id="file" type="file" multiple accept="image/jpeg,image/png,image/heic,image/heif,image/*" />
    </label>
    
    <!-- 批量圖片選擇縮圖列 -->
    <div class="thumb-list" id="thumbList" style="display:none;"></div>

    <p class="hint">iPhone 選圖後若有「加入／完成」請按下去。可一次選最多 5 張相片切換編輯。</p>
    
    <div class="frames">
      <button class="w on" data-frame="white">白框</button>
      <button class="k" data-frame="black">黑框</button>
      <button class="t" data-frame="tint">取色半透明</button>
      <button class="v" data-frame="vintage">復古黃紙</button>
      <button class="f" data-frame="film">經典底片</button>
    </div>
    
    <div class="ratios" id="ratios">
      <button class="on" data-aspect="orig">原圖</button>
      <button data-aspect="mini">Mini</button>
      <button data-aspect="square">方框</button>
      <button data-aspect="wide">Wide</button>
    </div>
    
    <div class="stage">
      <div class="polaroid-container">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>
    
    <div class="form">
      <div class="row2">
        <label class="field">顯示 EXIF 參數
          <select id="show-exif">
            <option value="on" selected>開</option>
            <option value="off">關</option>
          </select>
        </label>
        <label class="field">自訂備註 / 標題
          <input id="note-text" placeholder="輸入隨想或地點...">
        </label>
      </div>

      <div class="row2" id="exif-row-1">
        <label class="field">相機<input id="cam" placeholder="X-T50"></label>
        <label class="field">鏡頭<input id="lens" placeholder="XF35mmF1.4 R"></label>
      </div>
      <div class="row2" id="exif-row-2">
        <label class="field">ISO<input id="iso" placeholder="400"></label>
        <label class="field">光圈<input id="fnum" placeholder="f/1.4"></label>
      </div>
      <label class="field" id="exif-row-3">快門<input id="shut" placeholder="1/250"></label>
      
      <div class="row3">
        <label class="field">字型
          <select id="font">
            <option value="sans">無襯線 (Noto Sans)</option>
            <option value="serif">經典明體 (Noto Serif)</option>
            <option value="mono">等寬數字 (Mono)</option>
            <option value="hand">手寫英文 (Caveat)</option>
            <option value="round">圓體 (Zen Maru)</option>
            <option value="kiwi">溫潤明體 (Kiwi Maru)</option>
            <option value="yuji">懷舊墨楷 (Yuji Syuku)</option>
          </select>
        </label>
        <label class="field">大小
          <select id="size">
            <option value="12">小</option>
            <option value="14" selected>中</option>
            <option value="18">大</option>
            <option value="22">特大</option>
          </select>
        </label>
        <label class="field">顏色<input id="color" type="color" value="#2c261e"></label>
      </div>
      
      <div class="row2">
        <label class="field">日期戳
          <select id="date-on">
            <option value="off">關</option>
            <option value="on">開</option>
          </select>
        </label>
        <label class="field">日期字體大小
          <select id="date-size">
            <option value="10">小</option>
            <option value="12" selected>中</option>
            <option value="15">大</option>
            <option value="18">特大</option>
          </select>
        </label>
      </div>
      
      <label class="field">日期<input id="date-text" placeholder="2026.09.07"></label>
      <div class="sides" id="date-sides">
        <button class="on" data-side="left">左側</button>
        <button data-side="right">右側</button>
      </div>
      
      <button class="pbtn ghost full" id="reset">重設文字位置</button>
      <button class="pbtn ghost full" id="reset-crop">重設裁切</button>
      <button class="pbtn red full" id="save">下載當前拍立得</button>
      <button class="pbtn ghost full" id="save-all" style="display:none;">打包下載全部 (ZIP/批量)</button>
    </div>
    <p class="hint">拖動照片調整裁切，電腦可用滾輪縮放。可直接在畫面上拖動文字與日期位置。</p>
  </div>

<script>
const $ = s => document.querySelector(s);

// 清脆俐落的單眼快門音效
function playCameraSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    [0.0, 0.075].forEach((delay, index) => {
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(index === 0 ? 260 : 180, now + delay);
      osc.frequency.exponentialRampToValueAtTime(80, now + delay + 0.025);

      oscGain.gain.setValueAtTime(0.5, now + delay);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.025);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.025);

      const bufSize = ctx.sampleRate * 0.02;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 2500;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.7, now + delay);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.02);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);

      noise.start(now + delay);
    });
  } catch (e) {}
}

const flash = () => { 
  const s = $("#shutter"); 
  s.classList.remove("go"); 
  void s.offsetWidth; 
  s.classList.add("go"); 
  playCameraSound();
};

const FONTS = {
  sans: '"Noto Sans TC", sans-serif',
  serif: '"Noto Serif TC", "Noto Serif JP", serif',
  mono: '"Share Tech Mono", monospace',
  hand: '"Caveat", cursive',
  round: '"Zen Maru Gothic", sans-serif',
  kiwi: '"Kiwi Maru", serif',
  yuji: '"Yuji Syuku", serif'
};

// 批量管理狀態
let itemsList = []; 
let currentIndex = 0;

// 單張狀態快照數據結構
function createDefaultItemState() {
  return {
    source: null,
    thumbUrl: '',
    frameStyle: "white",
    tintColor: "rgba(120,90,70,0.58)",
    aspect: "orig",
    crop: { z: 1, x: 0, y: 0 },
    pos: { left: 6, right: 6 },
    dateSide: "left",
    datePos: 18,
    cam: "", lens: "", iso: "", fnum: "", shut: "", dateText: "",
    noteText: "", showExif: "on"
  };
}

let activeState = createDefaultItemState();

function syncStateFromUI() {
  if (!activeState) return;
  activeState.cam = $("#cam").value;
  activeState.lens = $("#lens").value;
  activeState.iso = $("#iso").value;
  activeState.fnum = $("#fnum").value;
  activeState.shut = $("#shut").value;
  activeState.dateText = $("#date-text").value;
  activeState.noteText = $("#note-text").value;
  activeState.showExif = $("#show-exif").value;
}

function syncUIFromState() {
  if (!activeState) return;
  $("#cam").value = activeState.cam || "";
  $("#lens").value = activeState.lens || "";
  $("#iso").value = activeState.iso || "";
  $("#fnum").value = activeState.fnum || "";
  $("#shut").value = activeState.shut || "";
  $("#date-text").value = activeState.dateText || "";
  $("#note-text").value = activeState.noteText || "";
  $("#show-exif").value = activeState.showExif || "on";

  // 按鈕狀態 toggle
  document.querySelectorAll(".frames button").forEach(x => x.classList.toggle("on", x.dataset.frame === activeState.frameStyle));
  document.querySelectorAll("#ratios button").forEach(x => x.classList.toggle("on", x.dataset.aspect === activeState.aspect));
  document.querySelectorAll("#date-sides button").forEach(x => x.classList.toggle("on", x.dataset.side === activeState.dateSide));
  
  toggleExifInputs();
}

function toggleExifInputs() {
  const show = $("#show-exif").value === "on";
  $("#exif-row-1").style.display = show ? "grid" : "none";
  $("#exif-row-2").style.display = show ? "grid" : "none";
  $("#exif-row-3").style.display = show ? "grid" : "none";
}

function getTargetPhotoSize() {
  if (!activeState.source) return { w: 1400, h: 1050 };
  let r = activeState.source.width / activeState.source.height;
  if (activeState.aspect === "mini") r = 2 / 3;
  else if (activeState.aspect === "square") r = 1;
  else if (activeState.aspect === "wide") r = 3 / 2;
  
  const w = 1400;
  return { w, h: Math.round(w / r) };
}

function coverRect(w, h) {
  if (!activeState.source) return { x:0, y:0, dw:w, dh:h };
  const sw = activeState.source.width, sh = activeState.source.height;
  const base = Math.max(w / sw, h / sh);
  const s = base * Math.max(1, activeState.crop.z);
  const dw = sw * s, dh = sh * s;
  let x = (w - dw) / 2 + activeState.crop.x;
  let y = (h - dh) / 2 + activeState.crop.y;
  if (dw >= w) x = Math.min(0, Math.max(w - dw, x)); else x = (w - dw) / 2;
  if (dh >= h) y = Math.min(0, Math.max(h - dh, y)); else y = (h - dh) / 2;
  return { x, y, dw, dh };
}

function drawAll() {
  syncStateFromUI();
  const canvas = $("#mainCanvas");
  const ctx = canvas.getContext("2d");
  
  const photoDim = getTargetPhotoSize();
  const sideMargin = Math.round(photoDim.w * 0.05);
  const bottomMargin = Math.round(photoDim.w * 0.22);
  
  const totalW = photoDim.w + sideMargin * 2;
  const totalH = photoDim.h + sideMargin + bottomMargin;
  
  canvas.width = totalW;
  canvas.height = totalH;

  // 清空畫布
  ctx.clearRect(0, 0, totalW, totalH);

  // 1. 背景與邊框繪製
  const frameStyle = activeState.frameStyle;
  if (frameStyle === "black") {
    ctx.fillStyle = "#111111";
    ctx.fillRect(0, 0, totalW, totalH);
  } else if (frameStyle === "tint") {
    if (activeState.source) {
      ctx.save();
      ctx.filter = "blur(30px) brightness(0.85)";
      ctx.drawImage(activeState.source, -totalW * 0.1, -totalH * 0.1, totalW * 1.2, totalH * 1.2);
      ctx.restore();
    }
    const m = activeState.tintColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    ctx.fillStyle = m ? `rgba(${m[1]},${m[2]},${m[3]},0.58)` : "rgba(100,80,70,0.58)";
    ctx.fillRect(0, 0, totalW, totalH);
  } else if (frameStyle === "vintage") {
    // 復古黃紙效果
    ctx.fillStyle = "#ebdcc4";
    ctx.fillRect(0, 0, totalW, totalH);
    // 紙張質感的輕微紋理噪點 overlay
    ctx.fillStyle = "rgba(110,80,40,0.05)";
    for (let i = 0; i < totalW; i += 8) {
      for (let j = 0; j < totalH; j += 8) {
        if ((i + j) % 3 === 0) ctx.fillRect(i, j, 4, 4);
      }
    }
    // 做內邊框裝飾線
    ctx.strokeStyle = "rgba(120,90,50,0.2)";
    ctx.lineWidth = Math.round(totalW * 0.005);
    ctx.strokeRect(sideMargin * 0.4, sideMargin * 0.4, totalW - sideMargin * 0.8, totalH - sideMargin * 0.8);
  } else if (frameStyle === "film") {
    // 經典底片效果
    ctx.fillStyle = "#0d0d0d";
    ctx.fillRect(0, 0, totalW, totalH);
    // 底片齒孔
    ctx.fillStyle = "#1f1f1f";
    const holeW = Math.round(sideMargin * 0.4);
    const holeH = Math.round(holeW * 1.3);
    for (let y = sideMargin; y < totalH - sideMargin; y += holeH * 1.8) {
      ctx.fillRect(sideMargin * 0.3, y, holeW, holeH);
      ctx.fillRect(totalW - sideMargin * 0.3 - holeW, y, holeW, holeH);
    }
    // 底片標記字樣
    ctx.fillStyle = "#e09f3e";
    ctx.font = `700 ${Math.round(totalW * 0.02)}px ${FONTS.mono}`;
    ctx.fillText("KODA 400", sideMargin, sideMargin * 0.6);
    ctx.fillText("▶ 12A", totalW - sideMargin * 2, totalH - bottomMargin * 0.25);
  } else {
    // 白框
    ctx.fillStyle = "#f7f3ec";
    ctx.fillRect(0, 0, totalW, totalH);
  }

  // 2. 照片區域繪製
  const photoX = sideMargin;
  const photoY = sideMargin;
  
  ctx.save();
  ctx.beginPath();
  ctx.rect(photoX, photoY, photoDim.w, photoDim.h);
  ctx.clip();
  
  if (activeState.source) {
    const r = coverRect(photoDim.w, photoDim.h);
    ctx.drawImage(activeState.source, photoX + r.x, photoY + r.y, r.dw, r.dh);
    sampleTint(ctx, photoX, photoY, photoDim.w, photoDim.h);
  } else {
    ctx.fillStyle = "#cfc6b8";
    ctx.fillRect(photoX, photoY, photoDim.w, photoDim.h);
  }
  ctx.restore();

  // 3. Exif 文字與自由備註繪製
  const fontKey = $("#font").value || "sans";
  const font = FONTS[fontKey] || FONTS.sans;
  const sizeBase = Number($("#size").value) || 14;
  const fontSize = Math.round(sizeBase * (totalW / 360));
  const textColor = $("#color").value;

  ctx.fillStyle = textColor;
  ctx.textBaseline = "top";

  const captionY = photoY + photoDim.h + Math.round(bottomMargin * 0.18);

  // 左側文字 (相機 & 鏡頭 & 自訂備註)
  const leftX = photoX + (activeState.pos.left / 100) * photoDim.w;
  const showExif = activeState.showExif === "on";
  const camText = showExif ? (activeState.cam.trim() || "") : "";
  const lensText = showExif ? activeState.lens.trim() : "";
  const noteText = activeState.noteText.trim();

  ctx.textAlign = "left";
  let currentY = captionY;

  if (camText) {
    ctx.font = `700 ${fontSize}px ${font}`;
    ctx.fillText(camText, leftX, currentY);
    currentY += fontSize + 6;
  }

  if (lensText) {
    ctx.font = `500 ${Math.round(fontSize * 0.82)}px ${font}`;
    ctx.fillText(lensText, leftX, currentY);
    currentY += Math.round(fontSize * 0.82) + 6;
  }

  if (noteText) {
    ctx.font = `500 ${Math.round(fontSize * 0.95)}px ${font}`;
    ctx.fillText(noteText, leftX, currentY);
  }

  // 右側文字 (ISO / 光圈 / 快門)
  if (showExif) {
    const rightX = photoX + photoDim.w - (activeState.pos.right / 100) * photoDim.w;
    const iso = activeState.iso.trim();
    const fnum = activeState.fnum.trim();
    const shut = activeState.shut.trim();
    const expText = [iso && ("ISO " + iso.replace(/^ISO\s*/i, "")), fnum, shut].filter(Boolean).join("   ");

    if (expText) {
      ctx.textAlign = "right";
      ctx.font = `700 ${fontSize}px ${font}`;
      ctx.fillText(expText, rightX, captionY + 4);
    }
  }

  // 4. 直書日期戳記繪製
  const dateOn = $("#date-on").value === "on" && (activeState.dateText || "").trim();
  if (dateOn) {
    const ds = (activeState.dateText || "").trim();
    const dateSizeBase = Number($("#date-size").value) || 12;
    const dsize = Math.round(dateSizeBase * (totalW / 360));
    
    ctx.save();
    ctx.fillStyle = textColor;
    ctx.font = `700 ${dsize}px ${font}`;
    
    const tx = activeState.dateSide === "left" 
      ? (sideMargin / 2) 
      : (totalW - sideMargin / 2);
      
    const ty = photoY + (activeState.datePos / 100) * photoDim.h;
    
    ctx.translate(tx, ty);
    ctx.rotate(Math.PI / 2);
    
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ds, 0, 0);
    ctx.restore();
  }
}

function sampleTint(ctx, px, py, pw, ph) {
  try {
    const step = Math.max(12, Math.floor(Math.min(pw, ph) / 20));
    let r = 0, g = 0, b = 0, n = 0;
    const imgData = ctx.getImageData(px, py, pw, ph).data;
    for (let y = 0; y < ph; y += step) {
      for (let x = 0; x < pw; x += step) {
        const i = (y * pw + x) * 4;
        r += imgData[i]; g += imgData[i + 1]; b += imgData[i + 2]; n++;
      }
    }
    if (!n) return;
    r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
    activeState.tintColor = `rgba(${r},${g},${b},0.58)`;
  } catch(e) {}
}

function fmtShutter(v){
  if (!v || !isFinite(v) || v <= 0) return "";
  if (v >= 1) return Number(v.toFixed(1)) + "s";
  return "1/" + Math.round(1 / v);
}

function fmtF(v){
  if (!v || !isFinite(v)) return "";
  const n = v >= 10 ? v.toFixed(0) : v.toFixed(1);
  return "f/" + n.replace(/\.0$/, "");
}

function cleanCam(make, model){
  model = (model || "").replace(/^FUJIFILM\s+/i, "").trim();
  make = (make || "").trim();
  if (!model && !make) return "";
  if (model && make && !/fuji/i.test(make) && !model.toUpperCase().includes(make.split(" ")[0].toUpperCase()))
    return (make + " " + model).trim();
  return model || make;
}

async function readExif(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] !== 0xFF || u8[1] !== 0xD8) return {};
  let off = 2;
  while (off + 4 < u8.length) {
    if (u8[off] !== 0xFF) break;
    const marker = u8[off + 1], size = (u8[off + 2] << 8) | u8[off + 3];
    if (marker === 0xE1) {
      const start = off + 4;
      const head = String.fromCharCode.apply(null, Array.from(u8.slice(start, start + 6)));
      if (head.startsWith("Exif")) return parseTiff(buf, start + 6);
    }
    if (marker === 0xDA) break;
    off += 2 + size;
  }
  return {};
}

function parseTiff(buf, start){
  const v = new DataView(buf);
  const le = v.getUint8(start) === 0x49;
  const u16 = o => v.getUint16(start + o, le);
  const u32 = o => v.getUint32(start + o, le);
  const decode = (type, count, valOff) => {
    const unit = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1 }[type] || 1;
    const inline = unit * count <= 4;
    const o = inline ? valOff : u32(valOff);
    try {
      if (type === 2) {
        let s = ""; for (let i = 0; i < count - 1; i++) { const c = v.getUint8(start + o + i); if (!c) break; s += String.fromCharCode(c); } return s;
      }
      if (type === 3) return v.getUint16(start + o, le);
      if (type === 4) return v.getUint32(start + o, le);
      if (type === 5) {
        const n = v.getUint32(start + o, le), d = v.getUint32(start + o + 4, le); return d ? n / d : 0;
      }
    } catch(e) {}
    return "";
  };
  const readIFD = rel => {
    const n = u16(rel), tags = {};
    for (let i = 0; i < n; i++) {
      const e = rel + 2 + i * 12;
      tags[u16(e)] = decode(u16(e + 2), u32(e + 4), e + 8);
    }
    return tags;
  };
  const ifd0 = readIFD(u32(4));
  const exif = ifd0[0x8769] ? readIFD(ifd0[0x8769]) : {};
  return {
    make: ifd0[0x010F] || "",
    model: ifd0[0x0110] || "",
    lens: exif[0xA434] || "",
    iso: exif[0x8827] || exif[0x8833] || "",
    fnum: exif[0x829D] || "",
    shut: exif[0x829A] || "",
    date: exif[0x9003] || exif[0x9004] || ifd0[0x0132] || ""
  };
}

async function processSingleFile(file) {
  const itemState = createDefaultItemState();
  const buf = await file.arrayBuffer();
  let meta = {};
  try { meta = await readExif(buf); } catch(e) {}
  itemState.cam = cleanCam(meta.make, meta.model);
  itemState.lens = (meta.lens || "").trim();
  itemState.iso = meta.iso ? String(meta.iso) : "";
  itemState.fnum = fmtF(Number(meta.fnum));
  itemState.shut = typeof meta.shut === "number" ? fmtShutter(meta.shut) : "";
  if (meta.date) {
    const m = String(meta.date).match(/(\d{4}).(\d{2}).(\d{2})/);
    if (m) itemState.dateText = m[1] + "." + m[2] + "." + m[3];
  }

  const blob = new Blob([buf], { type: file.type || "image/jpeg" });
  itemState.thumbUrl = URL.createObjectURL(blob);
  
  try {
    itemState.source = await createImageBitmap(blob, { imageOrientation: "from-image" });
  } catch(e) {
    try {
      itemState.source = await createImageBitmap(blob);
    } catch(e2) {
      const url = itemState.thumbUrl;
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      itemState.source = await createImageBitmap(img);
    }
  }
  return itemState;
}

async function loadFiles(files) {
  const maxFiles = Array.from(files).slice(0, 5); // 限制最多 5 張
  itemsList = [];
  
  for (const f of maxFiles) {
    const st = await processSingleFile(f);
    itemsList.push(st);
  }

  if (itemsList.length > 0) {
    currentIndex = 0;
    activeState = itemsList[0];
    renderThumbnails();
    syncUIFromState();
    drawAll();
  }

  $("#save-all").style.display = itemsList.length > 1 ? "block" : "none";
}

function renderThumbnails() {
  const container = $("#thumbList");
  if (itemsList.length <= 1) {
    container.style.display = "none";
    return;
  }
  container.style.display = "flex";
  container.innerHTML = "";

  itemsList.forEach((st, idx) => {
    const div = document.createElement("div");
    div.className = "thumb-item" + (idx === currentIndex ? " active" : "");
    const img = document.createElement("img");
    img.src = st.thumbUrl;
    div.appendChild(img);
    div.onclick = () => {
      syncStateFromUI();
      currentIndex = idx;
      activeState = itemsList[idx];
      renderThumbnails();
      syncUIFromState();
      drawAll();
    };
    container.appendChild(div);
  });
}

function exportCard() {
  if (!activeState.source) { alert("先上傳照片"); return; }
  drawAll();
  flash();
  const canvas = $("#mainCanvas");
  canvas.toBlob(function(b) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `polaroid_${currentIndex + 1}.png`;
    a.click();
  }, "image/png");
}

async function exportAllCards() {
  if (!itemsList.length || !window.JSZip) {
    alert("請先讀取照片或確認網路連接");
    return;
  }
  syncStateFromUI();
  flash();
  const zip = new JSZip();

  for (let i = 0; i < itemsList.length; i++) {
    activeState = itemsList[i];
    drawAll();
    const canvas = $("#mainCanvas");
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    zip.file(`polaroid_${i + 1}.png`, blob);
  }

  // 恢復當前選擇
  activeState = itemsList[currentIndex];
  drawAll();

  const content = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(content);
  a.download = "polaroids_batch.zip";
  a.click();
}

["cam","lens","iso","fnum","shut","font","size","color","date-on","date-size","date-text","note-text"].forEach(id => {

// Canvas 觸控與互動
(function bindCanvasInteractions() {
  const canvas = $("#mainCanvas");
  let mode = null;
  let sx = 0, sy = 0;
  let ox = 0, oy = 0;
  let startPosVal = 0;
  let pinching = false, startZ = 1, startDist = 0;

  const pt = e => e.touches ? e.touches[0] : e;
  const dist = e => {
    const a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  };

  const getCanvasCoords = e => {
    const rect = canvas.getBoundingClientRect();
    const p = pt(e);
    const scale = canvas.width / rect.width;
    return {
      x: (p.clientX - rect.left) * scale,
      y: (p.clientY - rect.top) * scale
    };
  };

  const down = e => {
    if (!activeState.source) return;
    
    if (e.touches && e.touches.length >= 2) {
      pinching = true;
      mode = "crop";
      startDist = dist(e);
      startZ = activeState.crop.z;
      return;
    }

    const { x, y } = getCanvasCoords(e);
    const photoDim = getTargetPhotoSize();
    const sideMargin = Math.round(photoDim.w * 0.05);
    const photoY = sideMargin;
    const captionY = photoY + photoDim.h;

    if (y > captionY) {
      if (x < canvas.width / 2) {
        mode = "textL";
        startPosVal = activeState.pos.left;
      } else {
        mode = "textR";
        startPosVal = activeState.pos.right;
      }
    } else if ($("#date-on").value === "on" && x < sideMargin * 2 && activeState.dateSide === "left") {
      mode = "stamp";
      startPosVal = activeState.datePos;
    } else if ($("#date-on").value === "on" && x > canvas.width - sideMargin * 2 && activeState.dateSide === "right") {
      mode = "stamp";
      startPosVal = activeState.datePos;
    } else {
      mode = "crop";
      ox = activeState.crop.x;
      oy = activeState.crop.y;
    }

    sx = pt(e).clientX;
    sy = pt(e).clientY;
    canvas.style.cursor = "grabbing";
  };

  const move = e => {
    if (!mode) return;
    
    if (pinching && e.touches && e.touches.length >= 2) {
      e.preventDefault();
      const d = dist(e);
      activeState.crop.z = Math.max(1, Math.min(4, startZ * (d / Math.max(1, startDist))));
      drawAll();
      return;
    }

    e.preventDefault();
    const photoDim = getTargetPhotoSize();
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;

    const dx = (pt(e).clientX - sx) * scale;
    const dy = (pt(e).clientY - sy) * scale;

    if (mode === "crop") {
      activeState.crop.x = ox + dx;
      activeState.crop.y = oy + dy;
    } else if (mode === "textL") {
      const deltaPercent = (dx / photoDim.w) * 100;
      activeState.pos.left = Math.max(2, Math.min(45, startPosVal + deltaPercent));
    } else if (mode === "textR") {
      const deltaPercent = (-dx / photoDim.w) * 100;
      activeState.pos.right = Math.max(2, Math.min(45, startPosVal + deltaPercent));
    } else if (mode === "stamp") {
      const deltaPercent = (dy / photoDim.h) * 100;
      activeState.datePos = Math.max(4, Math.min(86, startPosVal + deltaPercent));
    }

    drawAll();
  };

  const up = () => {
    mode = null;
    pinching = false;
    canvas.style.cursor = "grab";
  };

  canvas.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);

  canvas.addEventListener("touchstart", down, { passive: false });
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  canvas.addEventListener("wheel", e => {
    if (!activeState.source) return;
    e.preventDefault();
    activeState.crop.z = Math.max(1, Math.min(4, activeState.crop.z + (e.deltaY < 0 ? 0.08 : -0.08)));
    drawAll();
  }, { passive: false });
})();

drawAll();
