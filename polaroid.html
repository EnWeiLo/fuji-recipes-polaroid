<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161311" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>拍立得工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+JP:wght@600&family=Noto+Serif+TC:wght@600;700&family=Share+Tech+Mono&family=Zen+MaruGothic:wght@500;700&family=Kiwi+Maru:wght@500&family=Yuji+Syuku&display=swap" rel="stylesheet" />
  <script src="vendor/jszip.min.js"></script>
  <style>
@font-face { font-family:"ChenYuluoyan"; src:url("fonts/ChenYuluoyan-2_0-Thin.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
@font-face { font-family:"OpenHuninn"; src:url("fonts/jf-openhuninn-2.1.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
    :root {
      --sumi:#141110; --char:#221e1a; --panel:#1c1815; --panel-2:#241f1b;
      --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
      --paper:#f4eee4; --ink:#2a2218; --cream:#f2ece1; --muted:#96897a;
      --fuji:#ff3b30; --fuji-dim:rgba(255,59,48,.16);
      --r-lg:20px; --r-md:14px; --r-sm:10px;
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
      --header-h:60px;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--sumi); color:var(--cream); font-family:"Noto Sans TC",sans-serif; }
    body { min-height:100dvh; background:radial-gradient(ellipse 900px 520px at 50% -10%, #3a2c24, transparent), var(--sumi); }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    a { color:inherit; }
    :focus-visible { outline:2px solid var(--fuji); outline-offset:2px; }
    @media (prefers-reduced-motion:reduce) { *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

    /* 頂部列 */
    .top {
      position:sticky; top:0; z-index:20; min-height:var(--header-h);
      padding:calc(10px + var(--safe-t)) 16px 10px;
      display:flex; align-items:center; gap:12px;
      background:color-mix(in srgb, var(--sumi) 88%, transparent);
      backdrop-filter:blur(18px) saturate(1.1); border-bottom:1px solid var(--line);
    }
    .icon-btn {
      width:42px; height:42px; border:1px solid var(--line); flex:none;
      background:var(--char); border-radius:50%; color:var(--cream);
      display:grid; place-items:center; font-size:16px;
      transition:transform .2s, background .2s;
    }
    .icon-btn:active { transform:scale(.94); }
    a.icon-btn { text-decoration:none; color:var(--cream); }
    .icon-btn svg { display:block; }
    .brand { flex:1; min-width:0; }
    .brand h1 { margin:0; font-family:"Noto Serif JP",serif; font-size:17px; letter-spacing:.14em; }
    .image-status {
      flex:none; padding:6px 12px; border:1px solid var(--line); border-radius:999px;
      color:var(--muted); font-size:12px; white-space:nowrap; background:rgba(255,255,255,.03);
    }
    .pbtn {
      border:0; min-height:40px; padding:0 16px; border-radius:999px;
      background:var(--paper); color:var(--ink); font-weight:700; font-size:14px;
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
      gap:6px; white-space:nowrap; transition:transform .15s, box-shadow .15s, opacity .15s;
    }
    .pbtn:active { transform:scale(.96); }
    .pbtn.red { background:var(--fuji); color:#fff; box-shadow:0 10px 22px rgba(255,59,48,.28); }
    .pbtn.ghost { background:rgba(255,255,255,.05); color:var(--cream); box-shadow:inset 0 0 0 1px var(--line); }
    .pbtn.full { width:100%; }
    .pbtn.sm { min-height:36px; padding:0 12px; font-size:13px; }

    .wrap { max-width:1160px; margin:0 auto; padding:18px 16px calc(32px + var(--safe-b)); }

    .editor-shell { display:flex; flex-direction:column; gap:16px; }

    /* 面板共用底 */
    .setup-panel, .control-panel, .sync-box {
      background:linear-gradient(160deg, var(--panel-2), var(--panel));
      border:1px solid var(--line); border-radius:var(--r-lg);
    }
    .setup-panel { padding:16px; }
    .section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 12px; }
    .section-heading h3 { margin:0; font-size:14px; font-weight:700; letter-spacing:.02em; }
    .section-heading p { margin:0; color:var(--muted); font-size:12px; }

    /* 選圖 */
    .pick {
      position:relative; display:grid; place-items:center;
      width:100%; min-height:52px; margin:0 0 12px;
      border:0; border-radius:var(--r-md); background:var(--paper); color:var(--ink);
      font-weight:700; font-size:14px; transition:transform .15s, box-shadow .15s;
    }
    .pick:hover { transform:translateY(-1px); box-shadow:0 10px 24px rgba(0,0,0,.25); }
    .pick input {
      position:absolute; inset:0; width:100%; height:100%;
      opacity:0; margin:0; cursor:pointer; font-size:16px;
    }

    /* 縮圖列 */
    .thumb-list {
      display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; margin:0 0 4px;
      scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
    }
    .thumb-list::-webkit-scrollbar { height:4px; }
    .thumb-list::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:4px; }
    .thumb-item {
      width:60px; height:60px; border-radius:12px; border:2px solid transparent;
      overflow:visible; cursor:pointer; flex-shrink:0; position:relative; background:#222;
      scroll-snap-align:start; transition:border-color .15s;
    }
    .thumb-item img { width:100%; height:100%; object-fit:cover; border-radius:9px; display:block; }
    .thumb-item.active { border-color:var(--fuji); }
    .thumb-del {
      position:absolute; top:-6px; right:-6px; width:20px; height:20px;
      border-radius:50%; background:var(--fuji); color:#fff; border:2px solid var(--sumi);
      font-size:11px; font-weight:bold; display:grid; place-items:center;
      line-height:1; cursor:pointer; z-index:2; box-shadow:0 2px 6px rgba(0,0,0,.4);
    }
    .thumb-del:hover { transform:scale(1.12); }
    .thumb-add {
      width:60px; height:60px; border-radius:12px; border:2px dashed var(--line-strong);
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-size:20px; font-weight:bold; flex-shrink:0; position:relative;
      background:rgba(255,255,255,.02); cursor:pointer; transition:border-color .15s, color .15s;
    }
    .thumb-add input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    .thumb-add:hover { border-color:var(--fuji); color:var(--cream); }

    .setup-help { margin:8px 1px 0; }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; }

    .preset-grid { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
    .preset-label { display:block; margin:0 0 8px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.03em; }
    .frames, .ratios { display:grid; gap:6px; margin:0; }
    .frames { grid-template-columns:repeat(5,1fr); }
    .ratios { grid-template-columns:repeat(4,minmax(0,1fr)); min-width:0; }
    .frames button, .ratios button, .sides button {
      border:0; min-height:40px; border-radius:var(--r-sm); font-weight:700; font-size:12.5px; padding:2px 4px;
      background:var(--char); color:var(--cream); box-shadow:inset 0 0 0 1px var(--line);
      transition:transform .12s, box-shadow .12s;
    }
    .frames .w { background:#f7f3ec; color:#2a2218; }
    .frames .k { background:#111; color:#f6efe4; box-shadow:inset 0 0 0 1px #444; }
    .frames .t { background:linear-gradient(90deg,#8a6a4a,#5a4032); color:#fff; }
    .frames .v { background:#e8dfcb; color:#4a3b2c; box-shadow:inset 0 0 0 1px #a89f8b; }
    .frames .f { background:#0d0d0d; color:#e09f3e; box-shadow:inset 0 0 0 1px #e09f3e; }
    .frames button.on, .ratios button.on, .sides button.on { box-shadow:inset 0 0 0 2px var(--fuji), 0 0 0 3px var(--fuji-dim); }
    .frames button:active, .ratios button:active, .sides button:active, .pbtn:active { transform:scale(.96); }
    .sides { grid-template-columns:1fr 1fr; }

    /* 預覽舞台 */
    .stage { display:grid; place-items:center; padding:16px; border-radius:var(--r-lg); background:rgba(0,0,0,.18); border:1px solid var(--line); }
    .polaroid-container {
      width:min(100%, 480px);
      box-shadow:0 20px 44px rgba(0,0,0,.5);
      animation:drop .5s cubic-bezier(.2,1.1,.3,1);
      overflow:hidden; border-radius:6px;
      background-image:
        linear-gradient(45deg, #222 25%, transparent 25%),
        linear-gradient(-45deg, #222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222 75%),
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size:16px 16px;
      background-position:0 0, 0 8px, 8px -8px, -8px 0px;
    }
    #mainCanvas { width:100%; height:auto; display:block; cursor:grab; touch-action:none; user-select:none; }
    @keyframes drop { from { opacity:0; transform:translateY(-18px) rotate(-4deg);} to { opacity:1; transform:none;} }

    /* 表單欄位 */
    .form { display:flex; flex-direction:column; gap:14px; }
    label.field { display:grid; gap:6px; font-size:12px; font-weight:600; color:var(--muted); }
    .field input, .field select, .field textarea {
      width:100%; min-height:44px; border:0; background:var(--char); border-radius:var(--r-sm); padding:10px 12px;
      box-shadow:inset 0 0 0 1px var(--line); outline:none; font-size:14px; color:var(--cream);
      transition:box-shadow .15s, background .15s;
    }
    .field input:focus, .field select:focus { background:var(--panel-2); box-shadow:inset 0 0 0 1px var(--fuji), 0 0 0 3px var(--fuji-dim); }
    .field input[type="color"] { height:44px; min-height:44px; padding:5px; border-radius:var(--r-sm); cursor:pointer; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

    .sync-box { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; padding:12px; }

    .control-panel { padding:16px; display:grid; gap:12px; }
    details.control-panel { padding:0; overflow:hidden; }
    details.control-panel[open] { padding:16px; }
    details.control-panel summary {
      list-style:none; padding:16px; cursor:pointer; font-size:14px; font-weight:700;
      display:flex; align-items:center; justify-content:space-between;
    }
    details.control-panel summary::-webkit-details-marker { display:none; }
    details.control-panel summary::after { content:'⌄'; color:var(--muted); transition:transform .2s; font-size:16px; }
    details.control-panel[open] summary { padding:0 0 13px; border-bottom:1px solid var(--line); margin-bottom:13px; }
    details.control-panel[open] summary::after { transform:rotate(180deg); }

    .action-group { display:flex; flex-direction:column; gap:8px; }
    .action-group .pbtn { min-height:48px; }
    .action-group > .row2:nth-of-type(2) { order:-1; }

    .shutter { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40; }
    .shutter.go { animation:flash .42s ease; }
    @keyframes flash { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }

    .editor-tip { margin:0; padding:0 2px; }

    /* 桌面：兩欄配置，預覽固定在左側 */
    @media (min-width:860px) {
      .top { padding-inline:max(16px, calc((100vw - 1160px) / 2)); }
      .editor-shell { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr); grid-template-rows:auto auto; gap:20px; align-items:start; }
      .setup-panel { grid-column:1 / -1; grid-row:1; }
      .stage { grid-column:1; grid-row:2; position:sticky; top:calc(var(--header-h) + 20px); }
      .form { grid-column:2; grid-row:2; }
      .editor-tip { grid-column:1 / -1; }
    }

    /* 手機：預覽固定在頂部，捲動時仍看得到即時成果 */
    @media (max-width:859px) {
      .stage {
        order:-1; position:sticky; z-index:10;
        top:calc(var(--header-h) + var(--safe-t) - 2px);
        margin:0 -16px; border-radius:0 0 22px 22px; padding:12px 16px 14px;
        display:flex; justify-content:center; align-items:center;
        transition:padding .2s ease;
      }
      /* 直式照片時改依「高度」縮放（由 JS 計算實際 px），避免預覽把畫面佔滿 */
      .polaroid-container { width:auto; max-width:min(78vw, 320px); }
      #mainCanvas { width:auto; height:auto; max-width:100%; display:block; }
      .stage.collapsed { padding-top:6px; padding-bottom:6px; }
      .stage.collapsed .polaroid-container { max-width:120px; }
      .stage-toggle {
        position:absolute; right:14px; bottom:8px; z-index:11;
        width:30px; height:30px; border-radius:50%; border:0;
        background:rgba(20,17,16,.72); color:var(--cream);
        box-shadow:inset 0 0 0 1px var(--line-strong); backdrop-filter:blur(6px);
        display:grid; place-items:center; font-size:13px; line-height:1;
      }
      .stage-toggle:active { transform:scale(.94); }
    }

    @media (max-width:520px) {
      .top { padding-inline:12px; }
      .top .pbtn { min-height:36px; padding-inline:12px; font-size:13px; }
      .wrap { padding:14px 12px calc(28px + var(--safe-b)); }
      .stage { margin-inline:-12px; }
      .image-status { padding:5px 10px; font-size:11px; }
      .setup-panel, .control-panel { border-radius:16px; }
      .preset-grid { grid-template-columns:1fr; gap:12px; }
      .frames button { font-size:10.5px; }
      .row2 { gap:7px; }
      .sync-box { grid-template-columns:1fr; }
    }
/* Standalone studio */
#exif-row-1 { align-items:start; }
*, *::before, *::after { border-radius:0 !important; }
.frames { grid-template-columns:repeat(3,minmax(0,1fr)); }
.frames button { display:flex; align-items:center; justify-content:center; gap:5px; }
.ratios button[data-aspect^="instagram"] { grid-column:span 2; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; font-size:clamp(10px,2.7vw,12.5px); }
.ratios button.on { box-shadow:inset 0 0 0 2px var(--fuji); }
.ig-icon { width:16px; height:16px; flex:none; }
.stage-toggle { display:none; }
@media(max-width:859px) { .stage-toggle { display:grid; } }
</style>
</head>
<body>
  <div class="shutter" id="shutter"></div>
  <header class="top">
    <a class="icon-btn back-btn" href="index.html" title="回到食譜頁面" aria-label="回到食譜頁面">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="brand"><h1>拍立得</h1></div>
    <span class="image-status" id="imageStatus">尚未選取照片</span>
  </header>
  <div class="wrap">
    <main class="editor-shell">
      <section class="setup-panel">
        <div class="section-heading"><h3>照片與版型</h3><p>最多 20 張</p></div>
        <label class="pick" id="mainPickLabel">選擇照片
          <input id="file" type="file" multiple accept="image/jpeg,image/png,image/heic,image/heif,image/*" />
        </label>
        <div class="thumb-list" id="thumbList" style="display:none;"></div>
        <p class="hint setup-help">選圖後請按「加入／完成」；點縮圖可切換，右上角可刪除。</p>
        <div class="preset-grid">
          <div><span class="preset-label">邊框樣式</span><div class="frames">
            <button class="w on" data-frame="white">白框</button><button class="k" data-frame="black">黑框</button><button class="t" data-frame="tint">取色</button><button class="v" data-frame="vintage">復古</button><button class="f" data-frame="film">底片</button>
          </div></div>
          <div><span class="preset-label">照片比例</span><div class="ratios" id="ratios">
            <button class="on" data-aspect="orig">原圖</button><button data-aspect="mini">Mini</button><button data-aspect="square">方框</button><button data-aspect="wide">Wide</button><button data-aspect="instagram" title="貼文 4:5"><svg class="ig-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram 貼文</button><button data-aspect="instagram-story" title="限時動態 9:16 · 1080 × 1920"><svg class="ig-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>Instagram 限時動態</button>
          </div></div>
        </div>
      </section>
      <div class="stage" id="stage">
        <div class="polaroid-container"><canvas id="mainCanvas"></canvas></div>
        <button type="button" class="stage-toggle" id="stageToggle" title="收合／展開預覽">﹀</button>
      </div>
      <div class="form">
      <!-- 特定照片同步設定區塊 -->
      <div class="sync-box" id="sync-container" style="display:none;">
        <label class="field">同步設定來源
          <select id="sync-source-select"></select>
        </label>
        <button class="pbtn ghost" id="apply-sync-btn" style="border-color: var(--fuji); color: var(--fuji);">套用設定</button>
      </div>

      <section class="control-panel">
        <div class="section-heading"><h3>文字資訊</h3><p>相機資料會自動帶入</p></div>
      <div class="row2">
        <label class="field">相機品牌／型號／鏡頭 顯示
          <select id="show-cam">
            <option value="on" selected>開</option>
            <option value="off">關</option>
          </select>
        </label>
        <label class="field" id="exposure-display-field" style="display:none">快門／光圈／ISO 顯示
          <select id="show-exp" disabled><option value="on">顯示</option><option value="off" selected>不顯示</option>
          </select>
        </label>
      </div>

      <label class="field">自訂備註 / 標題
        <input id="note-text" placeholder="輸入隨想或地點...">
      </label>
      <p class="hint" id="note-layout-help" aria-live="polite"></p>
      <div class="row2">
        <label class="field">自訂備註字型<select id="note-font">
            <option value="sans">無襯線 (Noto Sans)</option>
            <option value="serif">經典明體 (Noto Serif)</option>
            <option value="mono">等寬數字 (Mono)</option>
            <option value="hand">手寫英文 (Caveat)</option>
            <option value="round">圓體 (Zen Maru)</option>
            <option value="kiwi">溫潤明體 (Kiwi Maru)</option>
            <option value="yuji">懷舊墨楷 (Yuji Syuku)</option>
          <option value="chen">辰宇落雁 2.0（細體）</option>
<option value="huninn">jf open 粉圓 2.1</option></select></label>
        <label class="field">自訂備註字體大小<select id="note-size"><option value="12">小</option><option value="14" selected>中</option><option value="18">大</option><option value="22">特大</option></select></label>
      </div>

      <div class="row2" id="exif-row-1">
        <div class="camera-fields" style="display:grid;gap:10px;align-content:start">
          <label class="field">相機品牌<select id="camera-brand"><option value="none">不顯示</option><option value="sony">SONY</option><option value="canon">Canon</option><option value="nikon">Nikon</option><option value="fujifilm">FUJIFILM</option><option value="manual">手動輸入</option></select></label>
          <label class="field" id="camera-brand-manual" style="display:none">手動輸入品牌<input id="camera-brand-text" placeholder="例如 FUJIFILM"></label>
          <label class="field">相機型號<select id="camera-select"><option value="none">不顯示</option><option value="sony-a7cii">α7C II</option><option value="manual">手動輸入</option></select></label>
          <label class="field" id="camera-manual-field" style="display:none">手動輸入型號<input id="cam" placeholder="例如 X-T50"></label>
        </div>
        <label class="field">鏡頭<input id="lens" placeholder="XF35mmF1.4 R"></label>
      </div>


      <div class="row2">
        <label class="field">相機／鏡頭字型
          <select id="font">
            <option value="sans">無襯線 (Noto Sans)</option>
            <option value="serif">經典明體 (Noto Serif)</option>
            <option value="mono">等寬數字 (Mono)</option>
            <option value="hand">手寫英文 (Caveat)</option>
            <option value="round">圓體 (Zen Maru)</option>
            <option value="kiwi">溫潤明體 (Kiwi Maru)</option>
            <option value="yuji">懷舊墨楷 (Yuji Syuku)</option>
          <option value="chen">辰宇落雁 2.0（細體）</option>

 return [{text:brand,mark:cameraBrandKey(brand)||null},{text:model,mark:/^α7C II$/i.test(normalizeCameraModel(model))?'alpha':null}].filter(part=>part.text);
}
function drawCameraMark(ctx,mask,left,y,height,color) {
 const width=height*mask.width/mask.height,scale=3,pad=6,c=document.createElement('canvas');
 c.width=Math.ceil(width*scale)+pad*2;c.height=Math.ceil(height*scale)+pad*2;
 const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 g.filter='blur(0.65px)';g.drawImage(mask,pad,pad,width*scale,height*scale);g.filter='none';
 g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);
 ctx.drawImage(c,left-pad/scale,y-pad/scale,c.width/scale,c.height/scale);
}
function drawCameraLine(ctx,parts,x,y,height,color,fontKey,maxWidth) {
 ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 ctx.font=textFont(fontKey,height,700);
 const gap=parts.length>1?height*.45:0;
 const widths=parts.map(p=>p.mark&&logoMasks[p.mark]?height*logoMasks[p.mark].width/logoMasks[p.mark].height:ctx.measureText(p.text).width);
 const total=widths.reduce((a,b)=>a+b,0)+gap*(parts.length-1),scale=Math.min(1,maxWidth/Math.max(1,total));
 ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle=color;ctx.textAlign='left';
 let left=-total/2;
 parts.forEach((part,i)=>{
  if(part.mark&&logoMasks[part.mark])drawCameraMark(ctx,logoMasks[part.mark],left,0,height,color);
  else ctx.fillText(part.text,left,0);
  left+=widths[i]+gap;
 });
 ctx.restore();
}
logoReady.then(()=>drawAll());

// 快門音效
function playCameraSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    [0.0, 0.075].forEach((delay, index) => {
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(index === 0 ? 260 : 180, now + delay);
      osc.frequency.exponentialRampToValueAtTime(80, now + delay + 0.025);

      oscGain.gain.setValueAtTime(0.5, now + delay);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.025);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.025);

      const bufSize = ctx.sampleRate * 0.02;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 2500;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.7, now + delay);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.02);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);

      noise.start(now + delay);
    });
  } catch (e) {}
}

const FONTS = {
  sans: '"Noto Sans TC", sans-serif',
  serif: '"Noto Serif TC", "Noto Serif JP", serif',
  mono: '"Share Tech Mono", monospace',
  hand: '"Caveat", cursive',
  round: '"Zen Maru Gothic", sans-serif',
  kiwi: '"Kiwi Maru", serif',
  yuji: '"Yuji Syuku", serif'
};

const LOCAL_FONTS={"chen":{"label":"辰宇落雁 2.0（細體）","family":"ChenYuluoyan"},"huninn":{"label":"jf open 粉圓 2.1","family":"OpenHuninn"}};
Object.entries(LOCAL_FONTS).forEach(([key,value])=>{FONTS[key]='"'+value.family+'", sans-serif';});
function textFont(key,size,weight=500) {
  return (LOCAL_FONTS[key] ? 400 : weight)+' '+size+'px '+(FONTS[key] || FONTS.sans);
}
const fontRequests=new Map(), failedFonts=new Set();
let pendingFontLoads=0, exportingBatch=false;
function updateFontStatus() {
 const status=$("#font-status");
 status.textContent=pendingFontLoads ? '字體載入中…' : failedFonts.size ? '部分字體無法載入，請確認 fonts 資料夾完整後重新整理。' : '';
 status.style.display=status.textContent ? 'block' : 'none';
}
function requestTextFont(key,weight,text) {
 if(!text)return Promise.resolve(true);
 const spec=textFont(key,16,weight),id=spec+(LOCAL_FONTS[key]?'':text);
 if(!fontRequests.has(id)) {
  pendingFontLoads++;updateFontStatus();
  const request=document.fonts.load(spec,text).then(faces=>{
   if(LOCAL_FONTS[key]&&!faces.length)throw Error('Font not loaded: '+key);
   return true;
  }).catch(()=>{failedFonts.add(key);return false;}).finally(()=>{
   pendingFontLoads--;updateFontStatus();
   if(!exportingBatch)drawAll(false);
  });
  fontRequests.set(id,request);
 }
 return fontRequests.get(id);
}
function prepareTextFonts(st) {
 const key=st.font||'sans';
 return Promise.all([
  requestTextFont(key,700,st.showCam==='on'?st.cam:''),
  requestTextFont(key,500,st.showCam==='on'?st.lens:''),
  requestTextFont(st.noteFont||key,500,st.noteText),
  requestTextFont(key,500,st.showExp==='on'?[st.fnum,st.shut,st.iso].join(' '):''),
  requestTextFont(key,700,st.dateOn==='on'?st.dateText:'')
 ]).then(results=>results.every(Boolean));
}

}

function updateSyncSelectOptions() {
  const syncContainer = $("#sync-container");

  if (itemsList.length <= 1) {
    syncContainer.style.display = "none";
    return;
  }

  syncContainer.style.display = "grid";
  select.innerHTML = "";

  itemsList.forEach((_, idx) => {

      opt.textContent = `第 ${idx + 1} 張照片`;

}

function getTargetPhotoSize() {
  if (activeState?.aspect === "instagram-story") return { w:980, h:1240 };
  if (activeState?.aspect === "instagram") return { w:1400, h:1645 };
  if (!activeState || !activeState.source) return { w: 1400, h: 1050 };
  let r = activeState.source.width / activeState.source.height;
  if (activeState.aspect === "mini") r = 2 / 3;
  else if (activeState.aspect === "square") r = 1;
  else if (activeState.aspect === "wide") r = 3 / 2;
  
  const w = 1400;
  return { w, h: Math.round(w / r) };
}

function getCardGeometry() {
  const photoDim=getTargetPhotoSize(),story=activeState?.aspect==='instagram-story';
  const sideMargin=story?50:Math.round(photoDim.w*.05);
  const topMargin=story?250:sideMargin;
  const bottomMargin=story?180:Math.round(photoDim.w*(activeState?.aspect==='instagram'?.15:.22));
  const safeBottom=story?250:0;
  return {photoDim,sideMargin,topMargin,bottomMargin,safeBottom,totalW:photoDim.w+sideMargin*2,totalH:topMargin+photoDim.h+bottomMargin+safeBottom};
}

function coverRect(w, h) {
  if (!activeState || !activeState.source) return { x:0, y:0, dw:w, dh:h };
  const sw = activeState.source.width, sh = activeState.source.height;
  const base = Math.max(w / sw, h / sh);
  const s = base * Math.max(1, activeState.crop.z);
  const dw = sw * s, dh = sh * s;
  let x = (w - dw) / 2 + activeState.crop.x;
  let y = (h - dh) / 2 + activeState.crop.y;
  if (dw >= w) x = Math.min(0, Math.max(w - dw, x)); else x = (w - dw) / 2;
  if (dh >= h) y = Math.min(0, Math.max(h - dh, y)); else y = (h - dh) / 2;
  return { x, y, dw, dh };
}

function drawAll(sync = true) {
  if (sync) syncStateFromUI();
  prepareTextFonts(activeState);
  const canvas = $("#mainCanvas");
  const ctx = canvas.getContext("2d");
  
  const {photoDim,sideMargin,topMargin,bottomMargin,safeBottom,totalW,totalH}=getCardGeometry();
  
  canvas.width = totalW;
  canvas.height = totalH;

  ctx.clearRect(0, 0, totalW, totalH);

  if (!activeState || !activeState.source) {
    ctx.fillStyle = "#f7f3ec";
    ctx.fillRect(0, 0, totalW, totalH);
    ctx.fillStyle = "#cfc6b8";
    ctx.fillRect(sideMargin, topMargin, photoDim.w, photoDim.h);
    return;
  }

  const frameStyle = activeState.frameStyle;
  if (frameStyle === "black") {
    ctx.fillStyle = "#111111";
    ctx.fillRect(0, 0, totalW, totalH);
  } else if (frameStyle === "tint") {
    if (activeState.source) {
      ctx.save();
      ctx.filter = "blur(30px) brightness(0.85)";
      ctx.drawImage(activeState.source, -totalW * 0.1, -totalH * 0.1, totalW * 1.2, totalH * 1.2);
      ctx.restore();
    }
    const m = activeState.tintColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    ctx.fillStyle = m ? `rgba(${m[1]},${m[2]},${m[3]},0.58)` : "rgba(100,80,70,0.58)";
    ctx.fillRect(0, 0, totalW, totalH);
  } else if (frameStyle === "vintage") {
    ctx.fillStyle = "#ebdcc4";
    ctx.fillRect(0, 0, totalW, totalH);
    ctx.fillStyle = "rgba(110,80,40,0.05)";
    for (let i = 0; i < totalW; i += 8) {
      for (let j = 0; j < totalH; j += 8) {
        if ((i + j) % 3 === 0) ctx.fillRect(i, j, 4, 4);
      }
    }
    ctx.strokeStyle = "rgba(120,90,50,0.2)";
    ctx.lineWidth = Math.round(totalW * 0.005);
    ctx.strokeRect(sideMargin * 0.4, sideMargin * 0.4, totalW - sideMargin * 0.8, totalH - sideMargin * 0.8);
  } else if (frameStyle === "film") {
    ctx.fillStyle = "#0d0d0d";
    ctx.fillRect(0, 0, totalW, totalH);
    ctx.fillStyle = "#1f1f1f";
    const holeW = Math.round(sideMargin * 0.4);
    const holeH = Math.round(holeW * 1.3);
    for (let y = sideMargin; y < totalH - sideMargin; y += holeH * 1.8) {
      ctx.fillRect(sideMargin * 0.3, y, holeW, holeH);
      ctx.fillRect(totalW - sideMargin * 0.3 - holeW, y, holeW, holeH);
    }
    ctx.fillStyle = "#e09f3e";
    ctx.font = `700 ${Math.round(totalW * 0.02)}px ${FONTS.mono}`;
    ctx.fillText("▶ 12A", totalW - sideMargin * 2, totalH - safeBottom - bottomMargin * 0.25);
  } else {
    ctx.fillStyle = "#f7f3ec";
    ctx.fillRect(0, 0, totalW, totalH);
  }

  const photoX = sideMargin;
  const photoY = topMargin;
  
  ctx.save();
  ctx.beginPath();
  ctx.rect(photoX, photoY, photoDim.w, photoDim.h);
  ctx.clip();
  
  if (activeState.source) {
    const r = coverRect(photoDim.w, photoDim.h);
    ctx.drawImage(activeState.source, photoX + r.x, photoY + r.y, r.dw, r.dh);
    sampleTint(ctx, photoX, photoY, photoDim.w, photoDim.h);
  }
  ctx.restore();

  const fontKey = activeState.font || "sans";
  const font = FONTS[fontKey] || FONTS.sans;
  const textColor = activeState.color;

  const sizeLeftBase = Number(activeState.sizeLeft) || 14;
  const fontSizeLeft = Math.round(sizeLeftBase * (totalW / 360));

  ctx.fillStyle = textColor;
  ctx.textBaseline = "top";

  const captionY = photoY + photoDim.h + Math.round(bottomMargin * 0.18);

  const leftX = photoX + (activeState.pos.left / 100) * photoDim.w;
  const showCam = activeState.showCam === "on";
  const camText = showCam ? (activeState.cam.trim() || "") : "";
  const lensText = showCam ? activeState.lens.trim() : "";
  const noteText = activeState.noteText.trim();


  const expText = hasExposureData(activeState) && activeState.showExp === "on"
    ? [activeState.fnum.trim(), activeState.shut.trim(), activeState.iso.trim() && ("ISO " + activeState.iso.trim().replace(/^ISO\s*/i, ""))].filter(Boolean).join("   ") : "";
  const rows=[];
  const cameraParts=showCam?getCameraParts(activeState):[];
  if(cameraParts.length)rows.push({parts:cameraParts,size:fontSizeLeft,weight:700,logo:cameraParts.some(p=>p.mark)});
  if(lensText) rows.push({text:lensText,size:fontSizeLeft*.82,weight:500});
  if(expText) rows.push({text:expText,size:fontSizeLeft*.7,weight:500});

  rows.forEach(row=>{if(row.logo)row.size*=.8;});
  const rowGap=fontSizeLeft*(expText ? .25 : .4);
  const available=bottomMargin*(expText ? .82 : .58);
  const natural=rows.reduce((n,row)=>n+row.size,0)+Math.max(0,rows.length-1)*rowGap;
  const factor=Math.min(1,available/Math.max(1,natural));
  let currentY=photoY+photoDim.h+bottomMargin*(expText ? .49 : .46)-natural*factor/2;
  const centerWidth=photoDim.w*.92;
  if(activeState.aspect==='instagram-story' && rows.length){
    // Center visible glyphs in the lower caption area marked by the user.
    // Keep 100 output pixels clear at the bottom for the reply interface.
    const infoCenter=(photoY+photoDim.h+totalH-100)/2;
    let visualTop=Infinity,visualBottom=-Infinity,offset=0;
    for(const row of rows){
      const size=row.size*factor;
      ctx.font=textFont(row.fontKey||fontKey,size,row.weight);
      let top,bottom;
      if(row.parts){
        const metrics=row.parts.map(part=>{
          if(part.mark&&logoMasks[part.mark])return {width:size*logoMasks[part.mark].width/logoMasks[part.mark].height,top:0,bottom:size};
          const m=ctx.measureText(part.text);return {width:m.width,top:-m.actualBoundingBoxAscent,bottom:m.actualBoundingBoxDescent};
        });
        const width=metrics.reduce((sum,m)=>sum+m.width,0)+Math.max(0,metrics.length-1)*size*.45;
        const scale=Math.min(1,centerWidth/Math.max(1,width));
        top=Math.min(...metrics.map(m=>m.top))*scale;
        bottom=Math.max(...metrics.map(m=>m.bottom))*scale;
      }else{
        const m=ctx.measureText(row.text);top=-m.actualBoundingBoxAscent;bottom=m.actualBoundingBoxDescent;
      }
      visualTop=Math.min(visualTop,offset+top);
      visualBottom=Math.max(visualBottom,offset+bottom);
      offset+=size+rowGap*factor;
    }
    currentY=infoCenter-(visualTop+visualBottom)/2;
  }
  const infoBounds=[];
  ctx.textAlign="center";
  for(const row of rows){
    const size=row.size*factor;
    ctx.font=textFont(row.fontKey || fontKey,size,row.weight);
    if(row.parts){
      const widths=row.parts.map(part=>part.mark&&logoMasks[part.mark]?size*logoMasks[part.mark].width/logoMasks[part.mark].height:ctx.measureText(part.text).width);
      const width=Math.min(centerWidth,widths.reduce((a,b)=>a+b,0)+Math.max(0,widths.length-1)*size*.45);
      infoBounds.push({left:(totalW-width)/2,top:currentY,bottom:currentY+size*1.25});
      drawCameraLine(ctx,row.parts,totalW/2,currentY,size,textColor,fontKey,centerWidth);
    }
    else {
      const metrics=ctx.measureText(row.text),width=Math.min(centerWidth,metrics.width);
      infoBounds.push({left:(totalW-width)/2,top:currentY-metrics.actualBoundingBoxAscent,bottom:currentY+metrics.actualBoundingBoxDescent});
      ctx.fillText(row.text,totalW/2,currentY,centerWidth);
    }
    currentY+=size+rowGap*factor;
  }


  // Notes never change camera typography or its layout width.
  // With information visible, reserve only the top-left caption box.
  // Without information, use one uncompressed line across the caption.
  const hasCameraInfo=rows.length>0;
  $("#note-layout-help").textContent=hasCameraInfo
    ? '目前備註限制在左上區域，不會縮小相機資訊。'
    : '目前備註以單行向右顯示，不自動換行。';
  if(noteText){
    const noteSize=(Number(activeState.noteSize)||14)*(totalW/360)*.85;
    const noteY=photoY+photoDim.h+bottomMargin*.04;
    const boxBottom=photoY+photoDim.h+bottomMargin*.32;
    let noteWidth=photoDim.w*.33;
    if(hasCameraInfo){
      // Protect long brand/model rows even if they extend into the note box.
      for(const bounds of infoBounds){
        if(bounds.top<boxBottom && bounds.bottom>noteY)
          noteWidth=Math.min(noteWidth,Math.max(0,bounds.left-photoX-photoDim.w*.015));
      }
    }else noteWidth=photoDim.w;
    ctx.save();ctx.beginPath();
    ctx.rect(photoX,noteY,noteWidth,hasCameraInfo?boxBottom-noteY:totalH-safeBottom-noteY);
    ctx.clip();ctx.textAlign='left';
    ctx.font=textFont(activeState.noteFont||fontKey,noteSize,500);
    if(!hasCameraInfo){
      ctx.fillText(noteText,photoX,noteY);
    }else if(noteWidth>0){
      const lineHeight=noteSize*1.2;
      const maxLines=Math.max(1,Math.floor((boxBottom-noteY)/lineHeight));
      const lines=[];let line='';
      for(const char of Array.from(noteText)){
        if(line && ctx.measureText(line+char).width>noteWidth){lines.push(line);line=char;}
        else line+=char;
      }
      if(line)lines.push(line);
      lines.slice(0,maxLines).forEach((text,i)=>ctx.fillText(text,photoX,noteY+i*lineHeight));
    }
    ctx.restore();
  }

  const dateOn = activeState.dateOn === "on" && (activeState.dateText || "").trim();
  if (dateOn) {
    const ds = (activeState.dateText || "").trim();
    const dateSizeBase = Number(activeState.dateSize) || 12;
    const dsize = Math.round(dateSizeBase * (totalW / 360));
    
    ctx.save();
    ctx.fillStyle = textColor;
    ctx.font = textFont(fontKey,dsize,700);
    
    const tx = activeState.dateSide === "left" 
      ? (sideMargin / 2) 
      : (totalW - sideMargin / 2);
      
    const ty = photoY + (activeState.datePos / 100) * photoDim.h;
    
    ctx.translate(tx, ty);
    ctx.rotate(Math.PI / 2);
    
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ds, 0, 0);
    ctx.restore();
  }
}

function sampleTint(ctx, px, py, pw, ph) {
  try {
    const step = Math.max(12, Math.floor(Math.min(pw, ph) / 20));
    let r = 0, g = 0, b = 0, n = 0;
    const imgData = ctx.getImageData(px, py, pw, ph).data;
    for (let y = 0; y < ph; y += step) {
      for (let x = 0; x < pw; x += step) {
        const i = (y * pw + x) * 4;
        r += imgData[i]; g += imgData[i + 1]; b += imgData[i + 2]; n++;
      }
    }
    if (!n) return;
    r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
    activeState.tintColor = `rgba(${r},${g},${b},0.58)`;
  } catch(e) {}
}

function fmtShutter(v){
  if (!v || !isFinite(v) || v <= 0) return "";
  if (v >= 1) return Number(v.toFixed(1)) + "s";
  return "1/" + Math.round(1 / v);
}

function fmtF(v){
  if (!v || !isFinite(v)) return "";
  const n = v >= 10 ? v.toFixed(0) : v.toFixed(1);
  return "f/" + n.replace(/\.0$/, "");
}

function cleanCam(make, model){
  model = (model || "").replace(/^FUJIFILM\s+/i, "").trim();
  make = (make || "").trim();
  if (/^(?:SONY\s+)?ILCE-7CM2$/i.test(model)) return "SONY α7C II";
  if (!model && !make) return "";
  if (model && make && !/fuji/i.test(make) && !model.toUpperCase().includes(make.split(" ")[0].toUpperCase()))
    return (make + " " + model).trim();
  return model || make;
}

async function readExif(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] !== 0xFF || u8[1] !== 0xD8) return {};
  let off = 2;
  while (off + 4 < u8.length) {
    if (u8[off] !== 0xFF) break;
    const marker = u8[off + 1], size = (u8[off + 2] << 8) | u8[off + 3];
    if (marker === 0xE1) {
      const start = off + 4;
      const head = String.fromCharCode.apply(null, Array.from(u8.slice(start, start + 6)));
      if (head.startsWith("Exif")) return parseTiff(buf, start + 6);
    }
    if (marker === 0xDA) break;
    off += 2 + size;
  }
  return {};
}

function parseTiff(buf, start){
  const v = new DataView(buf);
  const le = v.getUint8(start) === 0x49;
  const u16 = o => v.getUint16(start + o, le);
  const u32 = o => v.getUint32(start + o, le);
  const decode = (type, count, valOff) => {
    const unit = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1 }[type] || 1;
    const inline = unit * count <= 4;
    const o = inline ? valOff : u32(valOff);
    try {
      if (type === 2) {
        let s = ""; for (let i = 0; i < count - 1; i++) { const c = v.getUint8(start + o + i); if (!c) break; s += String.fromCharCode(c); } return s;
      }
      if (type === 3) return v.getUint16(start + o, le);
      if (type === 4) return v.getUint32(start + o, le);
      if (type === 5) {
        const n = v.getUint32(start + o, le), d = v.getUint32(start + o + 4, le); return d ? n / d : 0;
      }
    } catch(e) {}
    return "";
  };
  const readIFD = rel => {
    const n = u16(rel), tags = {};
    for (let i = 0; i < n; i++) {
      const e = rel + 2 + i * 12;
      tags[u16(e)] = decode(u16(e + 2), u32(e + 4), e + 8);
    }
    return tags;
  };
  const ifd0 = readIFD(u32(4));
  const exif = ifd0[0x8769] ? readIFD(ifd0[0x8769]) : {};
  return {
    make: ifd0[0x010F] || "",
    model: ifd0[0x0110] || "",
    lens: exif[0xA434] || "",
    iso: exif[0x8827] || exif[0x8833] || "",
    fnum: exif[0x829D] || "",
    shut: exif[0x829A] || "",
    date: exif[0x9003] || exif[0x9004] || ifd0[0x0132] || ""
  };
}

async function processSingleFile(file) {
  const itemState = createDefaultItemState();
  const buf = await file.arrayBuffer();
  let meta = {};
  try { meta = await readExif(buf); } catch(e) {}
  itemState.cam = cleanCam(meta.make, meta.model);
  if(meta.make || meta.model) {
    itemState.cameraBrand=(meta.make||'').trim();
    let model=(meta.model||'').trim();
    if(itemState.cameraBrand && model.toLowerCase().startsWith(itemState.cameraBrand.toLowerCase()+' '))model=model.slice(itemState.cameraBrand.length).trim();
    itemState.cameraModel=normalizeCameraModel(model);
    itemState.cam=[itemState.cameraBrand,itemState.cameraModel].filter(Boolean).join(' ');
  }
  itemState.lens = (meta.lens || "").trim();
  itemState.iso = meta.iso ? String(meta.iso) : "";
  itemState.fnum = fmtF(Number(meta.fnum));
  itemState.shut = typeof meta.shut === "number" ? fmtShutter(meta.shut) : "";
  if (meta.date) {
    const m = String(meta.date).match(/(\d{4}).(\d{2}).(\d{2})/);
    if (m) itemState.dateText = m[1] + "." + m[2] + "." + m[3];
  }

  const blob = new Blob([buf], { type: file.type || "image/jpeg" });
  itemState.thumbUrl = URL.createObjectURL(blob);
  
  try {
    itemState.source = await createImageBitmap(blob, { imageOrientation: "from-image" });
  } catch(e) {
    try {
      itemState.source = await createImageBitmap(blob);
    } catch(e2) {
      const url = itemState.thumbUrl;
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      itemState.source = await createImageBitmap(img);
    }
  }
  return itemState;
}

let addingFiles=false;
async function appendFiles(files) {
  if(addingFiles)return;
  addingFiles=true;
  syncStateFromUI();
  try {
  const maxAllowed = 20 - itemsList.length;
  if (maxAllowed <= 0) {
    alert("最多只能上傳 20 張照片！請先刪除部分照片再加入。");
    return;
  }

  if(files.length>maxAllowed)alert("最多 20 張，僅加入前 "+maxAllowed+" 張。");
  const filesToAdd = Array.from(files).slice(0, maxAllowed);
  const firstNewIndex=itemsList.length;
  for(const f of filesToAdd){
    try {itemsList.push(await processSingleFile(f));}
    catch(err){alert("無法讀取 "+f.name+"，請改用 JPEG 或 PNG。");}
  }

  if (itemsList.length > 0) {
    currentIndex = Math.min(firstNewIndex,itemsList.length-1);
    activeState = itemsList[currentIndex];
    renderThumbnails();
    syncUIFromState();
    drawAll();
  }
}

  finally { addingFiles=false; }
}

function deletePhoto(idx, e) {
  if (e) e.stopPropagation();
  
  syncStateFromUI();
  const removed=itemsList.splice(idx,1)[0];
  URL.revokeObjectURL(removed.thumbUrl); removed.source?.close?.();
  if(idx<currentIndex) currentIndex--;

  if (itemsList.length === 0) {
    activeState = createDefaultItemState();
    currentIndex = 0;
  } else {
    if (currentIndex >= itemsList.length) {
      currentIndex = itemsList.length - 1;
    }
    activeState = itemsList[currentIndex];
  }

  renderThumbnails();
  syncUIFromState();
  drawAll();
}

function renderThumbnails() {
  const container = $("#thumbList");
  const mainPickLabel = $("#mainPickLabel");
  const imageStatus = $("#imageStatus");

  if (itemsList.length === 0) {
    imageStatus.textContent = "尚未選取照片";
    container.style.display = "none";
    mainPickLabel.style.display = "grid";
    $("#save-all").style.display = "none";
    $("#sync-container").style.display = "none";
    return;
  }

  imageStatus.textContent = `第 ${currentIndex + 1} 張／共 ${itemsList.length} 張`;
  mainPickLabel.style.display = "none";
  container.style.display = "flex";
  container.innerHTML = "";

  itemsList.forEach((st, idx) => {
    const div = document.createElement("div");
    div.className = "thumb-item" + (idx === currentIndex ? " active" : "");

    const img = document.createElement("img");
    img.src = st.thumbUrl;
    div.appendChild(img);

    const delBtn = document.createElement("div");
    delBtn.className = "thumb-del";
    delBtn.innerHTML = "✕";
    delBtn.title = "刪除照片";
    delBtn.onclick = (e) => deletePhoto(idx, e);
    div.appendChild(delBtn);

    div.onclick = () => {
      syncStateFromUI();
      currentIndex = idx;
      activeState = itemsList[idx];
      renderThumbnails();
      syncUIFromState();
      drawAll();
    };

    container.appendChild(div);
  });

  if (itemsList.length < 20) {
    const addBtn = document.createElement("div");
    addBtn.className = "thumb-add";
    addBtn.innerHTML = `+<input id="fileAdd" type="file" multiple accept="image/jpeg,image/png,image/heic,image/heif,image/*" />`;
    
    const fileAddInput = addBtn.querySelector("input");
    fileAddInput.addEventListener("change", e => {
      if (e.target.files && e.target.files.length > 0) {
        appendFiles(e.target.files).catch(err => alert(err.message || "讀取照片失敗"));
      }
    });

    container.appendChild(addBtn);
  }

  $("#save-all").style.display = itemsList.length > 1 ? "block" : "none";
  updateSyncSelectOptions();
}

async function exportCard() {
  syncStateFromUI();
  if(!await prepareTextFonts(activeState)){alert('字體尚未成功載入，請確認字體檔案後重試。');return;}
  await logoReady; await document.fonts.ready;
  if (!activeState || !activeState.source) { alert("先上傳照片"); return; }
  drawAll();
  flash();
  const canvas = $("#mainCanvas");
  canvas.toBlob(function(b) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `polaroid_${currentIndex + 1}.png`;
    a.click();
  }, "image/png");
}

// 快速分享當前照片 (支援 Web Share API，桌面降級為複製到剪貼簿)
async function shareCard() {
  syncStateFromUI();
  if(!await prepareTextFonts(activeState)){alert('字體尚未成功載入，請確認字體檔案後重試。');return;}
  await logoReady; await document.fonts.ready;
  if (!activeState || !activeState.source) { alert("先上傳照片"); return; }
  drawAll();
  flash();
  const canvas = $("#mainCanvas");

  canvas.toBlob(async function(blob) {
    if (!blob) return;
    const file = new File([blob], `polaroid_${currentIndex + 1}.png`, { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "拍立得照片",
          text: "分享我的拍立得照片！"
        });
      } catch (err) {
        if (err.name !== "AbortError") {
          alert("分享時發生錯誤，改為直接下載照片。");
          exportCard();
        }
      }
    } else {
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ [blob.type]: blob })
        ]);
        alert("已將拍立得圖片複製到剪貼簿！可直接至 IG 限動或通訊軟體貼上。");
      } catch (err) {
        alert("目前瀏覽器不支援直接分享檔案，已為你下載圖片。");
        exportCard();
      }
    }
  }, "image/png");
}

async function exportAllCards() {
  syncStateFromUI();
  const ready=await Promise.all(itemsList.map(prepareTextFonts));
  if(ready.includes(false)){alert('部分字體未成功載入，請確認字體檔案後重試。');return;}
  await logoReady; await document.fonts.ready;
  if (!itemsList.length || !window.JSZip) {
    alert("請先讀取照片或確認網路連接");
    return;
  }
  syncStateFromUI();
  flash();
  const zip = new JSZip();

  exportingBatch=true;
  try {
  for (let i = 0; i < itemsList.length; i++) {
    activeState = itemsList[i];
    drawAll(false);
    const canvas = $("#mainCanvas");
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    zip.file(`polaroid_${i + 1}.png`, blob);
  }

  } finally {
    exportingBatch=false;
    activeState = itemsList[currentIndex];
    drawAll(false);
  }

  const content = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(content);
  a.download = "polaroids_batch.zip";
  a.click();
}

function applySyncFromSelectedPhoto() {
  const select = $("#sync-source-select");
  const targetIdx = Number(select.value);

  if (isNaN(targetIdx) || !itemsList[targetIdx]) return;

  const targetState = itemsList[targetIdx];

  activeState.showCam = targetState.showCam;
  activeState.showExp = hasExposureData(activeState) ? targetState.showExp : "off";
  activeState.noteText = targetState.noteText;
  activeState.dateOn = targetState.dateOn;
  activeState.datePos = targetState.datePos;
  activeState.dateSide = targetState.dateSide;
  activeState.dateSize = targetState.dateSize;
  activeState.color = targetState.color;
  activeState.font = targetState.font;
  activeState.noteFont = targetState.noteFont || targetState.font;
  activeState.noteSize = targetState.noteSize || "14";
  activeState.sizeLeft = targetState.sizeLeft;
  activeState.pos = { ...targetState.pos };

  syncUIFromState();
  drawAll();
}

  $("#camera-brand-manual").style.display = $("#camera-brand").value === "manual" ? "grid" : "none";

$("#apply-sync-btn").onclick = applySyncFromSelectedPhoto;
$("#reset").onclick = () => { if (activeState) { activeState.pos = { left: 6, right: 6 }; activeState.datePos = 18; drawAll(); } };
$("#reset-crop").onclick = () => { if (activeState) { activeState.crop = { z: 1, x: 0, y: 0 }; drawAll(); } };

  }
});

// Canvas 觸控與互動
(function bindCanvasInteractions() {
  const canvas = $("#mainCanvas");
  let mode = null;
  let sx = 0, sy = 0;
  let ox = 0, oy = 0;
  let startPosVal = 0;
  let pinching = false, startZ = 1, startDist = 0;

  const pt = e => e.touches ? e.touches[0] : e;
  const dist = e => {
    const a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  };

  const getCanvasCoords = e => {
    const rect = canvas.getBoundingClientRect();
    const p = pt(e);
    const scale = canvas.width / rect.width;
    return {
      x: (p.clientX - rect.left) * scale,
      y: (p.clientY - rect.top) * scale
    };
  };

  const down = e => {
    if (!activeState || !activeState.source) return;
    
    if (e.touches && e.touches.length >= 2) {
      pinching = true;
      mode = "crop";
      startDist = dist(e);
      startZ = activeState.crop.z;
      return;
    }

    const { x, y } = getCanvasCoords(e);
    const {photoDim,sideMargin,topMargin}=getCardGeometry();
    const photoY = topMargin;
    const captionY = photoY + photoDim.h;

    if (y > captionY) {
      return;
    } else if ($("#date-on").value === "on" && x < sideMargin * 2 && activeState.dateSide === "left") {
      mode = "stamp";
      startPosVal = activeState.datePos;
    } else if ($("#date-on").value === "on" && x > canvas.width - sideMargin * 2 && activeState.dateSide === "right") {
      mode = "stamp";
      startPosVal = activeState.datePos;
    } else {
      mode = "crop";
      ox = activeState.crop.x;
      oy = activeState.crop.y;
    }

    sx = pt(e).clientX;
    sy = pt(e).clientY;
    canvas.style.cursor = "grabbing";
  };

  const move = e => {
    if (!mode || !activeState) return;
    
    if (pinching && e.touches && e.touches.length >= 2) {
      e.preventDefault();
      const d = dist(e);
      activeState.crop.z = Math.max(1, Math.min(4, startZ * (d / Math.max(1, startDist))));
      drawAll();
      return;
    }

    e.preventDefault();
    const photoDim = getTargetPhotoSize();
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;

    const dx = (pt(e).clientX - sx) * scale;
    const dy = (pt(e).clientY - sy) * scale;

    if (mode === "crop") {
      activeState.crop.x = ox + dx;
      activeState.crop.y = oy + dy;
    } else if (mode === "textL") {
      const deltaPercent = (dx / photoDim.w) * 100;
      activeState.pos.left = Math.max(2, Math.min(45, startPosVal + deltaPercent));
    } else if (mode === "textR") {
      const deltaPercent = (-dx / photoDim.w) * 100;
      activeState.pos.right = Math.max(2, Math.min(45, startPosVal + deltaPercent));
    } else if (mode === "stamp") {
      const deltaPercent = (dy / photoDim.h) * 100;
      activeState.datePos = Math.max(4, Math.min(86, startPosVal + deltaPercent));
    }

    drawAll();
  };

  const up = () => {
    mode = null;
    pinching = false;
    canvas.style.cursor = "grab";
  };

  canvas.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);

  canvas.addEventListener("touchstart", down, { passive: false });
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  canvas.addEventListener("wheel", e => {
    if (!activeState || !activeState.source) return;
    e.preventDefault();
    activeState.crop.z = Math.max(1, Math.min(4, activeState.crop.z + (e.deltaY < 0 ? 0.08 : -0.08)));
    drawAll();
  }, { passive: false });
})();

// 手機版：依「可用高度」而非單純寬度縮放預覽，避免直式照片把畫面佔滿
(function fitStagePreview() {
  const stage = $("#stage");
  const canvas = $("#mainCanvas");
  const toggle = $("#stageToggle");
  if (!stage || !canvas || !toggle) return;

  function isMobile() { return window.innerWidth <= 859; }

  function apply() {
    if (!isMobile()) {
      canvas.style.width = "";
      canvas.style.height = "";
      return;
    }
    if (!canvas.width || !canvas.height) return;

    const collapsed = stage.classList.contains("collapsed");
    const maxW = Math.min(window.innerWidth * 0.78, 320);
    // 收合時只留一小條，展開時最多用掉約 40% 的視窗高度
    const maxH = collapsed ? 92 : Math.max(160, window.innerHeight * 0.4);
    const ratio = canvas.width / canvas.height;

    let w = maxW;
    let h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }

    canvas.style.width = Math.round(w) + "px";
    canvas.style.height = Math.round(h) + "px";
  }

  toggle.addEventListener("click", () => {
    stage.classList.toggle("collapsed");
    toggle.textContent = stage.classList.contains("collapsed") ? "﹁" : "﹀";
    apply();
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(apply, 80);
  });
  window.addEventListener("orientationchange", () => setTimeout(apply, 150));

  const origDrawAll = drawAll;
  drawAll = function (...args) {
    origDrawAll.apply(this, args);
    apply();
  };

  apply();
})();

drawAll();
